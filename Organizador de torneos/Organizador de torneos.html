  /* ═══════════════════════════════════════════════════════════
     GENERADOR DE PDF — usa canvas nativo + window.print trick
     via una ventana HTML autónoma con @media print
  ═══════════════════════════════════════════════════════════ */
  function generateTournamentPDF(lang) {
    const sp    = state.scheduleParams;
    const fi    = state.finances;
    const ALL_E = ALL_EVENTS;
    const ordered = ALL_E.filter(e => state.selectedEvents.includes(e.id));

    const showEs   = lang === 'es'   || lang === 'both';
    const showEn   = lang === 'en'   || lang === 'both';

    function fmtN(n) { return Number(n).toLocaleString('es-CO'); }
    function sumT(rows) { return rows.reduce((s,r) => { const v=parseFloat(String(r.total||'').replace(/[^0-9.]/g,'')); return s+(isNaN(v)?0:v);},0); }

    // ── Date string ──
    const _dates = (state.eventDates||[]).filter(d=>d.trim());
    const datesStr = _dates.length > 0
      ? _dates.map(d=>new Date(d+'T12:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'long',year:'numeric'})).join(' · ')
      : (state.eventDate||'—');

    const cname = (typeof WCA_COUNTRIES !== 'undefined' ? WCA_COUNTRIES : []).find(c=>c[0]===state.country)?.[1] || state.country;
    const FORMATS_LABEL = { a:'Avg 5', m:'Mean 3', '3':'Bo3', '2':'Bo2', '1':'Bo1' };
    const SLOT_PX = 2; // px per minute in PDF calendar

    // ── Schedule: combined per-day (table + graphic), one page per day ──
    function scheduleFullHTML() {
      if (state.schedule.length === 0) return '<h2>Horario</h2><p style="color:#888;font-size:13px">Sin horario programado.</p>';

      const COLORS = ['#5b8cff','#4dffc0','#ffb84d','#ff7575','#c882ff','#50dcb4','#ffa064','#64c8ff','#ffe066','#b4ff80','#ff80c8','#80ccff','#ffc880','#80ffe0','#d4c0ff','#ff9090','#90ffb8'];
      const ROOM_C = ['#5b8cff','#4dffc0','#ffb84d','#ff7575','#c882ff','#50dcb4','#ffa064','#64c8ff'];
      const MAX_CAL_PX = 720;
      const HDR_H = 22;
      const FORMATS_LABEL = { a:'Avg 5', m:'Mean 3', '3':'Bo3', '2':'Bo2', '1':'Bo1' };

      let html = '';

      sp.days.forEach((day, di) => {
        // Each day starts on its own page (page-break-before on the wrapper div)
        // First day just uses page-break-after:avoid on h2 so title+content stay together
        const pb = di === 0
          ? 'margin-top:0'
          : 'page-break-before:always;margin-top:0';

        const dayBlocks = [...state.schedule.filter(b => b.dayIdx === di)]
          .sort((a,b) => a.roomIdx - b.roomIdx || a.startMin - b.startMin);

        // ── Day header (inside the page-break container) ──
        html += `<div style="${pb};page-break-inside:avoid">`;
        if (di === 0) html += `<h2 style="page-break-after:avoid">Horario</h2>`;
        html += `<h3 style="font-size:14px;font-weight:700;color:#1a1a2e;margin:${di===0?'12px':'0'} 0 8px;padding-bottom:4px;border-bottom:2px solid #5b8cff;page-break-after:avoid">${day.label} — ${day.date}</h3>`;

        // ── Table for this day ──
        if (dayBlocks.length === 0) {
          html += `<p style="color:#888;font-size:13px;margin-bottom:16px">Sin bloques para este día.</p>`;
        } else {
          html += `<table class="pdf-table" style="margin-bottom:16px"><thead><tr>
            <th>Hora inicio</th><th>Hora fin</th><th>Evento</th><th>Ronda</th><th>Sala</th><th>Duración</th>
          </tr></thead><tbody>`;
          dayBlocks.forEach(bl => {
            const isCust = bl.isCustom || !bl.eventId;
            const ev = !isCust ? ALL_E.find(e => e.id === bl.eventId) : null;
            const isAttempt = !isCust && bl.eventId === '333fm' && bl.attemptIdx != null;
            const title = isCust ? bl.customName : (isAttempt ? `${ev ? ev.name : bl.eventId} (Intento ${bl.attemptIdx+1})` : (ev ? ev.name : bl.eventId));
            const sh = day.startHour+Math.floor(bl.startMin/60), sm = bl.startMin%60;
            const em = bl.startMin+bl.durationMin;
            const eh = day.startHour+Math.floor(em/60), emm = em%60;
            const ts  = `${String(sh).padStart(2,'0')}:${String(sm).padStart(2,'0')}`;
            const te  = `${String(eh).padStart(2,'0')}:${String(emm).padStart(2,'0')}`;
            const ds  = bl.durationMin>=60 ? Math.floor(bl.durationMin/60)+'h'+(bl.durationMin%60?String(bl.durationMin%60).padStart(2,'0')+'min':'') : bl.durationMin+'min';
            const rd  = !isCust ? state.rounds[bl.eventId]?.[bl.roundIdx] : null;
            const fmt = isCust ? 'Actividad' : (rd ? (FORMATS_LABEL[rd.format]||rd.format) : '—');
            const rdStr = isCust ? 'Actividad' : (isAttempt ? `R${bl.roundIdx+1} · Int.${bl.attemptIdx+1}` : `R${bl.roundIdx+1} · ${fmt}`);
            html += `<tr><td>${ts}</td><td>${te}</td><td>${title}</td><td>${rdStr}</td><td>${sp.rooms[bl.roomIdx]||'—'}</td><td>${ds}</td></tr>`;
          });
          html += `</tbody></table>`;
        }

        // ── Graphic calendar for this day ──
        const totalMin = (day.endHour - day.startHour) * 60;
        const dynPx    = Math.min(1.8, MAX_CAL_PX / totalMin);
        const totalPx  = Math.round(totalMin * dynPx);
        const colW     = Math.max(80, Math.floor(520 / sp.rooms.length));

        html += `<div style="display:flex;border:1px solid #ccd;border-radius:4px;overflow:hidden">`;

        // axis
        html += `<div style="width:50px;flex-shrink:0;position:relative;height:${totalPx+HDR_H}px;border-right:1px solid #dde;background:#f8f8fc;-webkit-print-color-adjust:exact;print-color-adjust:exact">
          <div style="height:${HDR_H}px;border-bottom:1px solid #dde"></div>`;
        for (let h = day.startHour; h <= day.endHour; h++) {
          const top = HDR_H + (h-day.startHour)*60*dynPx;
          html += `<div style="position:absolute;top:${top}px;right:4px;font-size:8px;color:#888;transform:translateY(-50%);white-space:nowrap">${String(h).padStart(2,'0')}:00</div>`;
          if (h < day.endHour) {
            const ht = HDR_H + (h-day.startHour)*60*dynPx + 30*dynPx;
            html += `<div style="position:absolute;top:${ht}px;left:0;right:0;border-top:1px dashed #ddd"></div>`;
          }
        }
        html += `</div>`;

        // room columns
        sp.rooms.forEach((rm, ri) => {
          const blocks = state.schedule.filter(b => b.dayIdx===di && b.roomIdx===ri);
          const rc = ROOM_C[ri % ROOM_C.length];
          html += `<div style="flex:1;min-width:${colW}px;position:relative;height:${totalPx+HDR_H}px;border-right:1px solid #dde;-webkit-print-color-adjust:exact;print-color-adjust:exact">
            <div style="height:${HDR_H}px;line-height:${HDR_H}px;font-size:10px;font-weight:700;text-align:center;padding:0 4px;background:${rc}33 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;border-bottom:2px solid ${rc};color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${rm}</div>`;

          // hour guides
          for (let h = day.startHour; h < day.endHour; h++) {
            const top = HDR_H + (h-day.startHour)*60*dynPx;
            html += `<div style="position:absolute;top:${top}px;left:0;right:0;border-top:1px solid #e8e8e8"></div>
                     <div style="position:absolute;top:${top+30*dynPx}px;left:0;right:0;border-top:1px dashed #ebebeb"></div>`;
          }

          // event blocks
          blocks.forEach(bl => {
            const isCust = bl.isCustom || !bl.eventId;
            const ev    = !isCust ? ALL_E.find(e => e.id === bl.eventId) : null;
            const isAttempt = !isCust && bl.eventId === '333fm' && bl.attemptIdx != null;
            const title = isCust ? bl.customName : (isAttempt ? `${ev?ev.name:bl.eventId} · R${bl.roundIdx+1} · Int.${bl.attemptIdx+1}` : `${ev?ev.name:bl.eventId} · R${bl.roundIdx+1}`);
            const color = isCust ? (bl.color || '#ffb84d') : COLORS[state.selectedEvents.indexOf(bl.eventId) % COLORS.length];
            const top   = HDR_H + bl.startMin * dynPx;
            const blH   = Math.max(bl.durationMin * dynPx, 14);
            const sh = day.startHour+Math.floor(bl.startMin/60), sm = bl.startMin%60;
            const em = bl.startMin+bl.durationMin;
            const eh = day.startHour+Math.floor(em/60), emm = em%60;
            const ts = `${String(sh).padStart(2,'0')}:${String(sm).padStart(2,'0')}–${String(eh).padStart(2,'0')}:${String(emm).padStart(2,'0')}`;
            html += `<div style="position:absolute;top:${top}px;left:2px;right:2px;height:${blH}px;background:${color} !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;border-radius:3px;padding:2px 4px;overflow:hidden;box-sizing:border-box;border-left:3px solid rgba(0,0,0,.2)">
              <div style="font-size:9px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25">${title}</div>
              ${blH > 20 ? `<div style="font-size:8px;color:rgba(255,255,255,.9);line-height:1.25">${ts}</div>` : ''}
            </div>`;
          });
          html += `</div>`;
        });

        html += `</div></div>`; // close flex + day wrapper
      });
      return html;
    }

    // ── Schedule table HTML (kept for internal use) ──
    function scheduleTableHTML() {
      if (state.schedule.length === 0) return '<p style="color:#888;font-size:13px">Sin horario programado.</p>';
      let html = '';
      sp.days.forEach((day, di) => {
        const blocks = [...state.schedule.filter(b=>b.dayIdx===di)].sort((a,b)=>a.roomIdx-b.roomIdx||a.startMin-b.startMin);
        if (!blocks.length) return;
        html += `<h3 style="margin:18px 0 8px;font-size:14px;color:#1a1a2e">${day.label} — ${day.date}</h3>
        <table class="pdf-table"><thead><tr><th>Hora inicio</th><th>Hora fin</th><th>Evento</th><th>Ronda</th><th>Sala</th><th>Duración</th></tr></thead><tbody>`;
        blocks.forEach(bl => {
          const ev = ALL_E.find(e=>e.id===bl.eventId);
          const sh = day.startHour+Math.floor(bl.startMin/60), sm=bl.startMin%60;
          const em = bl.startMin+bl.durationMin;
          const eh = day.startHour+Math.floor(em/60), emm=em%60;
          const ts = `${String(sh).padStart(2,'0')}:${String(sm).padStart(2,'0')}`;
          const te = `${String(eh).padStart(2,'0')}:${String(emm).padStart(2,'0')}`;
          const ds = bl.durationMin>=60?Math.floor(bl.durationMin/60)+'h'+(bl.durationMin%60?String(bl.durationMin%60).padStart(2,'0')+'min':''):bl.durationMin+'min';
          html += `<tr><td>${ts}</td><td>${te}</td><td>${ev?ev.name:bl.eventId}</td><td>R${bl.roundIdx+1}</td><td>${sp.rooms[bl.roomIdx]||'—'}</td><td>${ds}</td></tr>`;
        });
        html += '</tbody></table>';
      });
      return html;
    }

    // ── Schedule graphic HTML (SVG-based calendar) ──
    function scheduleGraphicHTML() {
      if (state.schedule.length === 0) return '';
      const COLORS = ['#5b8cff','#4dffc0','#ffb84d','#ff7575','#c882ff','#50dcb4','#ffa064','#64c8ff','#ffe066','#b4ff80','#ff80c8','#80ccff','#ffc880','#80ffe0','#d4c0ff','#ff9090','#90ffb8'];
      // A4 usable height ~220mm ≈ 830px. Reserve 60px for day header + margins.
      const MAX_CAL_PX = 770;
      let html = '';
      sp.days.forEach((day, di) => {
        const totalMin = (day.endHour - day.startHour) * 60;
        // Scale px/min so the full day fits within MAX_CAL_PX
        const dynPx    = Math.min(SLOT_PX, Math.floor(MAX_CAL_PX / totalMin * 10) / 10);
        const totalPx  = Math.round(totalMin * dynPx);
        const HDR_H    = 22; // room column header height px
        const colW     = Math.max(100, Math.floor(520 / sp.rooms.length));

        // Each day gets page-break-before:always (except first) so it starts on its own page
        const pb = di === 0 ? '' : 'page-break-before:always;';

        html += `<div style="${pb}margin:0;padding-top:8px">
          <div style="font-size:13px;font-weight:700;color:#1a1a2e;margin-bottom:8px;padding-bottom:4px;border-bottom:2px solid #5b8cff">
            ${day.label} — ${day.date}
          </div>
          <div style="display:flex;border:1px solid #ccd;border-radius:4px;overflow:hidden">
            <!-- eje horario -->
            <div style="width:50px;flex-shrink:0;position:relative;height:${totalPx + HDR_H}px;border-right:1px solid #dde;background:#f8f8fc">
              <div style="height:${HDR_H}px;border-bottom:1px solid #dde"></div>`;

        for (let h = day.startHour; h <= day.endHour; h++) {
          const top = HDR_H + (h - day.startHour) * 60 * dynPx;
          html += `<div style="position:absolute;top:${top}px;right:4px;font-size:8px;color:#888;transform:translateY(-50%);white-space:nowrap">${String(h).padStart(2,'0')}:00</div>`;
          if (h < day.endHour) {
            const halfTop = HDR_H + (h - day.startHour) * 60 * dynPx + 30 * dynPx;
            html += `<div style="position:absolute;top:${halfTop}px;left:0;right:0;border-top:1px dashed #e0e0e0"></div>`;
          }
        }
        html += `</div>`;

        // columnas por sala
        sp.rooms.forEach((rm, ri) => {
          const blocks = state.schedule.filter(b => b.dayIdx===di && b.roomIdx===ri);
          const roomColor = ['#5b8cff','#4dffc0','#ffb84d','#ff7575','#c882ff','#50dcb4','#ffa064','#64c8ff'][ri % 8];
          html += `<div style="flex:1;min-width:${colW}px;position:relative;height:${totalPx + HDR_H}px;border-right:1px solid #dde">
            <div style="height:${HDR_H}px;font-size:10px;font-weight:700;text-align:center;padding:0 4px;line-height:${HDR_H}px;background:${roomColor}33 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;border-bottom:2px solid ${roomColor};color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${rm}</div>`;

          // guías horarias
          for (let h = day.startHour; h < day.endHour; h++) {
            const top = HDR_H + (h - day.startHour) * 60 * dynPx;
            html += `<div style="position:absolute;top:${top}px;left:0;right:0;border-top:1px solid #e8e8e8"></div>`;
            html += `<div style="position:absolute;top:${top + 30*dynPx}px;left:0;right:0;border-top:1px dashed #ebebeb"></div>`;
          }

          // bloques de eventos
          blocks.forEach(bl => {
            const ev    = ALL_E.find(e => e.id === bl.eventId);
            const top   = HDR_H + bl.startMin * dynPx;
            const blH   = Math.max(bl.durationMin * dynPx, 14);
            const color = COLORS[state.selectedEvents.indexOf(bl.eventId) % COLORS.length];
            const sh = day.startHour + Math.floor(bl.startMin/60), sm = bl.startMin % 60;
            const em = bl.startMin + bl.durationMin;
            const eh = day.startHour + Math.floor(em/60), emm = em % 60;
            const ts = `${String(sh).padStart(2,'0')}:${String(sm).padStart(2,'0')}–${String(eh).padStart(2,'0')}:${String(emm).padStart(2,'0')}`;
            html += `<div style="position:absolute;top:${top}px;left:2px;right:2px;height:${blH}px;background:${color} !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;border-radius:3px;padding:2px 4px;overflow:hidden;box-sizing:border-box;border-left:3px solid rgba(0,0,0,.25)">
              <div style="font-size:9px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2">${ev ? ev.name : bl.eventId} · R${bl.roundIdx+1}</div>
              ${blH > 20 ? `<div style="font-size:8px;color:rgba(255,255,255,.9);line-height:1.2">${ts}</div>` : ''}
            </div>`;
          });
          html += '</div>';
        });
        html += '</div></div>';
      });
      return html;
    }

    // ── Rounds table ──
    function roundsTableHTML() {
      let html = '';
      const ordEvs = ALL_E.filter(e=>state.selectedEvents.includes(e.id));
      ordEvs.forEach(ev => {
        const rds = state.rounds[ev.id]||[];
        if (!rds.length) return;
        html += `<h3 style="margin:14px 0 6px;font-size:13px">${ev.name}</h3>
          <table class="pdf-table"><thead><tr><th>Ronda</th><th>Formato</th><th>Tiempo límite</th><th>Corte</th><th>Avanzan</th></tr></thead><tbody>`;
        rds.forEach((rd,i) => {
          const isFinal = i===rds.length-1;
          html += `<tr><td>Ronda ${i+1}${isFinal?' (Final)':''}</td><td>${FORMATS_LABEL[rd.format]||rd.format}</td><td>${rd.timeLimit||'—'}</td><td>${ev.hasCutoff&&rd.cutoff?rd.cutoff:'N/A'}</td><td>${!isFinal&&rd.advance?rd.advance+(rd.advanceType==='p'?'%':''):'Final'}</td></tr>`;
        });
        html += '</tbody></table>';
      });
      return html;
    }

    // ── Finance tables ──
    function financeHTML() {
      if (!fi.income.length && !fi.expenses.length) return '<p style="color:#888;font-size:13px">Sin datos financieros.</p>';
      const incTotal = sumT(fi.income), expTotal = sumT(fi.expenses), balance = incTotal-expTotal;
      let html = '';
      if (fi.income.length) {
        html += `<h3 style="margin:14px 0 6px;font-size:13px">Ingresos</h3>
          ${fi.sponsorship?`<p style="font-size:12px;color:#555;margin-bottom:8px">Patrocinio: ${fi.sponsorship}</p>`:''}
          <table class="pdf-table"><thead><tr><th>Descripción</th><th>Cantidad</th><th>Precio unit.</th><th>Total</th></tr></thead><tbody>`;
        fi.income.forEach(r => { html += `<tr><td>${r.desc||'—'}</td><td>${r.qty||'—'}</td><td>${r.unit||'—'}</td><td>${r.total?'$'+fmtN(parseFloat(String(r.total).replace(/[^0-9.]/g,''))):' —'}</td></tr>`; });
        html += `</tbody><tfoot><tr><td colspan="3"><strong>Total ingresos</strong></td><td><strong>$${fmtN(incTotal)}</strong></td></tr></tfoot></table>`;
      }
      if (fi.expenses.length) {
        html += `<h3 style="margin:14px 0 6px;font-size:13px">Gastos</h3>
          <table class="pdf-table"><thead><tr><th>Gasto</th><th>Cantidad</th><th>Precio unit.</th><th>Total</th></tr></thead><tbody>`;
        fi.expenses.forEach(r => { html += `<tr><td>${r.desc||'—'}</td><td>${r.qty||'—'}</td><td>${r.unit||'—'}</td><td>${r.total?'$'+fmtN(parseFloat(String(r.total).replace(/[^0-9.]/g,''))):' —'}</td></tr>`; });
        html += `</tbody><tfoot><tr><td colspan="3"><strong>Total gastos</strong></td><td><strong>$${fmtN(expTotal)}</strong></td></tr></tfoot></table>`;
      }
      html += `<div style="margin-top:12px;padding:10px 16px;background:${balance>=0?'#e8fdf4':'#fde8e8'};border-radius:8px;font-weight:700;font-size:14px;color:${balance>=0?'#0a7a4a':'#a01010'}">Balance: $${fmtN(balance)}</div>`;
      return html;
    }

    // ── Photos HTML ──
    function photosHTML() {
      if (!state.photos.length) return '';
      let html = '<div style="display:flex;flex-wrap:wrap;gap:12px;margin:8px 0">';
      state.photos.forEach(ph => {
        html += `<div style="width:160px"><img src="${ph.dataUrl}" style="width:160px;height:110px;object-fit:cover;border-radius:6px;display:block">
          ${ph.caption?`<p style="font-size:10px;color:#555;margin-top:4px;text-align:center">${ph.caption}</p>`:''}
        </div>`;
      });
      return html + '</div>';
    }

    // ── Registration instructions ──
    function regHTML(text, title) {
      if (!text.trim()) return '';
      const items = text.split('\n').map(l=>l.trim()).filter(l=>l).map(l=>{
        const m=l.match(/^(\d+)\.\s*(.*)/);
        return m?`<div style="display:flex;gap:8px;margin-bottom:6px"><span style="font-weight:700;color:#5b8cff;min-width:20px">${m[1]}.</span><span>${m[2]}</span></div>`:`<p style="font-weight:600;margin-bottom:8px">${l}</p>`;
      }).join('');
      return `<h2 style="font-size:15px;letter-spacing:1px;color:#1a1a2e;margin:18px 0 10px">${title}</h2>${items}`;

  .pdf-table tfoot td{background:#ededf5 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-weight:600;border-top:2px solid #ccd}
  .info-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;border:1px solid #dde;border-radius:6px;overflow:hidden;margin-bottom:4px}
  .info-cell{padding:10px 14px;border-right:1px solid #dde;border-bottom:1px solid #dde}
  .info-cell:nth-child(3n){border-right:none}

  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
  @media print{
    body{padding:16px 24px}
    @page{margin:12mm 10mm;size:A4 portrait}
    h2{page-break-after:avoid}
    .pdf-table{page-break-inside:auto}
    tr{page-break-inside:avoid}
    .cal-day-page{page-break-before:always}

  }
</style>
</head>
<body>

<h1>${state.name}</h1>

${showEs&&state.regEs ? `<h2>Registro</h2>${regHTML(state.regEs,'REGISTRO')}` : ''}
${showEn&&state.regEn ? `${showEs?'<div class="section-divider"></div>':'<h2>Registration</h2>'}${regHTML(state.regEn,'REGISTRATION')}` : ''}

<h2>Eventos y rondas</h2>
${roundsTableHTML()}

${scheduleFullHTML()}

${state.photos.length ? `<h2>Fotos</h2>${photosHTML()}` : ''}

<h2>Ingresos y Gastos</h2>
${financeHTML()}

</body></html>`;

    // Open print window
    const win = window.open('', '_blank', 'width=960,height=800');
    if (!win) { alert('Permite ventanas emergentes para generar el PDF.'); return; }
    win.document.write(html);
    win.document.close();
    win.addEventListener('load', () => {
      setTimeout(() => { win.focus(); win.print(); }, 400);
    });
  }


  render();
}

  .to-rd-final { font-size:11.5px; color:var(--acc2); font-weight:700; font-family:var(--mono); text-align:center; display:block; }

  .to-adv-wrap { display:flex; align-items:center; gap:4px; }
  .to-adv-toggle { display:flex; border:1px solid var(--brd); border-radius:4px; overflow:hidden; }
  .to-adv-type {
    background:var(--surf); border:none; color:var(--txt3);
    font-size:10px; font-family:var(--mono); padding:3px 5px;
    cursor:pointer; transition:all .15s;
  }
  .to-adv-type.active { background:var(--acc); color:#08090d; font-weight:700; }
  .to-adv-input { flex:1; min-width:36px; padding:5px 4px; text-align:center; }

  /* ── paso registro (1.5) ── */
  .to-reg-cols {
    display:grid; grid-template-columns:1fr 1fr; gap:16px;
  }
  @media(max-width:640px){ .to-reg-cols{grid-template-columns:1fr;} }
  .to-reg-panel {
    background:var(--surf); border:1px solid var(--brd);
    border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:10px;
  }
  .to-reg-panel-header { display:flex; align-items:center; gap:8px; }
  .to-reg-panel-title { font-size:13px; font-weight:700; color:#ffffff; }
  .to-reg-title { font-family:var(--mono); font-size:11.5px; font-weight:700; color:#93c5fd; text-transform:uppercase; }
  .to-reg-textarea {
    width:100%; background:var(--surf2); color:#ffffff;
    border:1px solid var(--brd); border-radius:8px;
    padding:10px 12px; font-family:var(--mono); font-size:12.5px;
    resize:vertical; min-height:160px; outline:none; transition:border-color .15s;
  }
  .to-reg-textarea:focus { border-color:var(--acc); }
  .to-reg-toolbar { display:flex; gap:6px; flex-wrap:wrap; }
  .to-reg-tool {
    background:var(--surf2); border:1px solid var(--brd);
    border-radius:6px; color:#cbd5e1; font-size:11.5px; font-family:var(--mono);
    padding:5px 10px; cursor:pointer; transition:all .15s; font-weight:600;
  }
  .to-reg-tool:hover { border-color:var(--acc); color:var(--acc); }

  /* ── vista previa de registro ── */
  .to-reg-preview-btn {
    background:var(--surf2); border:1px solid var(--brd); border-radius:8px;
    color:var(--acc); font-family:var(--mono); font-size:11px; font-weight:700;
    padding:5px 12px; cursor:pointer; transition:all .15s; margin-left:auto;
    display:inline-flex; align-items:center; gap:6px;
  }
  .to-reg-preview-btn:hover { border-color:var(--acc); background:rgba(56,189,248,.15); color:#ffffff; }

  .to-reg-preview {
    display:flex; flex-direction:column; gap:18px; margin-top:10px;
  }
  .to-prv-block {
    background:var(--surf); border:1px solid var(--brd); border-radius:12px;
    padding:18px 22px; box-shadow:0 2px 10px rgba(0,0,0,.25);
  }
  .to-prv-header {
    display:flex; align-items:center; gap:10px; padding-bottom:12px;
    margin-bottom:14px; border-bottom:1px solid var(--brd);
  }
  .to-reg-lang-badge {
    font-family:var(--mono); font-size:10.5px; font-weight:800;
    padding:3px 8px; border-radius:5px; letter-spacing:.5px;
  }
  .to-reg-lang-badge.es {
    background:rgba(56,189,248,.15); color:var(--acc); border:1px solid rgba(56,189,248,.3);
  }
  .to-reg-lang-badge.en {
    background:rgba(52,211,153,.15); color:var(--acc2); border:1px solid rgba(52,211,153,.3);
  }
  .to-prv-title {
    font-family:var(--mono); font-size:12.5px; font-weight:700; color:#ffffff; letter-spacing:1px;
  }
  .to-prv-body { display:flex; flex-direction:column; gap:10px; }
  .to-prv-item {
    display:flex; align-items:flex-start; gap:10px;
    font-size:13.5px; line-height:1.5;
  }
  .to-prv-n {
    font-family:var(--mono); font-size:12.5px; font-weight:700; color:var(--acc3);
    min-width:22px; flex-shrink:0;
  }
  .to-prv-text { flex:1; color:#ffffff; font-weight:500; }
  .to-prv-p { font-size:13.5px; color:var(--txt2); line-height:1.5; margin:0; }

  /* ── schedule step styles (2.5) ── */
  .sch-params-grid {
    display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:14px 16px 0;
  }
  .sch-rooms-list { display:flex; flex-direction:column; gap:8px; }
  .sch-room-row { display:flex; align-items:center; gap:8px; }
  .sch-room-color { width:12px; height:12px; border-radius:3px; flex-shrink:0; }
  .sch-room-input { flex:1; }
  .sch-room-del {
    background:rgba(255,117,117,.1); border:1px solid rgba(255,117,117,.3);
    border-radius:6px; color:var(--danger); width:28px; height:28px;
    cursor:pointer; font-size:14px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s;
  }
  .sch-room-del:hover { background:rgba(255,117,117,.2); }

  /* ── tabla de tiempos ── */
  .sch-times-head {
    display:grid; grid-template-columns:140px 115px 1fr;
    gap:10px; padding:0 4px 8px;
    font-size:11px; letter-spacing:.8px; text-transform:uppercase;
    color:#93c5fd; font-weight:700; font-family:var(--mono);
    border-bottom:1px solid var(--brd); margin-bottom:8px;
  }
  .sch-times-row {
    display:grid; grid-template-columns:140px 115px 1fr;
    gap:10px; margin-bottom:10px; align-items:center;
  }
  .sch-ev-label { font-size:13.5px; color:#ffffff; font-weight:600; }
  .sch-t-input { padding:6px 8px; font-size:13px; width:75px; font-weight:600; color:#ffffff; }
  .sch-t-btn-save {
    background:rgba(56,189,248,.12); border:1px solid rgba(56,189,248,.3); border-radius:6px;
    color:var(--acc); font-size:11.5px; font-weight:700; cursor:pointer; padding:6px 8px;
    line-height:1; transition:all .15s; font-family:var(--mono);
  }
  .sch-t-btn-save:hover { background:var(--acc); color:#08090d; }

  .sch-chips { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .sch-round-dur-item {
    display:inline-flex; align-items:center; gap:4px;
    background:var(--surf2); border:1px solid var(--brd);
    border-radius:8px; padding:3px 7px; font-family:var(--mono);
    transition:border-color .15s, background .15s;
  }
  .sch-round-dur-item.is-custom {
    border-color:var(--acc2); background:rgba(52,211,153,.12);
  }
  .sch-round-dur-lbl { font-size:11.5px; font-weight:700; color:var(--acc); }
  .sch-round-dur-item.is-custom .sch-round-dur-lbl { color:var(--acc2); }
  .sch-round-dur-input {
    width:46px; padding:4px 2px; font-size:12px; font-family:var(--mono); font-weight:700;
    text-align:center; border:1px solid var(--brd); background:var(--surf);
    border-radius:5px; color:#ffffff; outline:none; transition:border-color .15s;
  }
  .sch-round-dur-input:focus { border-color:var(--acc); }
  .sch-round-dur-input::placeholder { color:#94a3b8; opacity:1; }

  .sch-round-btn {
    background:var(--surf); border:1px solid var(--brd); border-radius:4px;
    color:var(--txt3); font-size:10px; font-family:var(--mono);
    cursor:pointer; padding:3px 5px; line-height:1; transition:all .15s;
  }
  .sch-round-btn-save { color:var(--acc2); border-color:rgba(52,211,153,.3); font-weight:700; }
  .sch-round-btn-save:hover { background:var(--acc2); color:#08090d; }
  .sch-round-btn-reset { color:var(--txt3); }
  .sch-round-btn-reset:hover { color:var(--danger); border-color:var(--danger); background:rgba(248,113,113,.15); }

  /* ── calendar ── */
  #sch-cal-wrap {
    display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start;
    gap: 20px; width: 100%; margin: 0 auto; box-sizing: border-box;
  }

  .sch-palette-label {
    font-size:11.5px; font-family:var(--mono); letter-spacing:.6px;
    text-transform:uppercase; color:#93c5fd; font-weight:700; margin-bottom:8px;
  }
  .sch-palette-empty { font-size:12.5px; color:var(--acc2); font-family:var(--mono); font-weight:700; }
  .sch-palette-grid { display:flex; flex-wrap:wrap; gap:6px; }
  .sch-pal-chip {
    display:inline-flex; align-items:center; gap:6px;
    background:var(--surf2); border:1px solid var(--brd);
    border-radius:6px; padding:5px 9px; cursor:pointer; user-select:none;
    transition:all .15s;
  }
  .sch-pal-chip:hover { border-color:var(--acc); transform:translateY(-1px); }
  .sch-pal-chip.is-selected {
    border-color:var(--acc2) !important; background:rgba(52,211,153,.15) !important;
    box-shadow:0 0 0 2px var(--acc2), 0 2px 8px rgba(52,211,153,.3); transform:translateY(-2px);
  }
  .sch-pal-name { font-size:12px; color:#ffffff; font-weight:600; }
  .sch-pal-round { font-family:var(--mono); font-size:10px; color:var(--acc); font-weight:700; }
  .sch-pal-dur {
    font-family:var(--mono); font-size:9.5px; color:var(--acc2);
    background:rgba(52,211,153,.12); padding:1px 5px; border-radius:4px; font-weight:700;
  }

  .sch-selection-banner {
    background:rgba(52,211,153,.12); border:1px solid var(--acc2);
    border-radius:8px; padding:8px 14px; margin:0 auto 10px; max-width:600px;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    font-family:var(--mono); font-size:12px; color:#ffffff;
    animation:bannerSlide .2s ease-out;
  }

  .sch-zoom-btn {
    background:transparent; border:none; color:var(--txt3);
    font-size:10.5px; font-family:var(--mono); padding:3px 7px;
    border-radius:4px; cursor:pointer; transition:all .15s; font-weight:600;
  }
  .sch-zoom-btn:hover { color:#ffffff; }
  .sch-zoom-btn.active { background:var(--surf); color:var(--acc); font-weight:700; }

  .sch-trash {
    background:rgba(255,117,117,.06); border:1px dashed rgba(255,117,117,.3);
    border-radius:8px; padding:7px 12px; margin:0 auto 10px; max-width:600px;
    font-size:11.5px; color:var(--danger); text-align:center;
    transition:background .15s; font-family:var(--mono);
  }
  .sch-trash.over { background:rgba(255,117,117,.18); }

  .sch-day {
    flex: 1 1 380px; max-width: 540px; min-width: 320px;
    background: var(--surf); border: 1px solid var(--brd);
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,.35); margin: 0;
  }
  .sch-day-header {
    display:flex; align-items:center; gap:10px;
    padding:8px 14px; border-bottom:1px solid var(--brd); margin-bottom:0;
    background: linear-gradient(90deg, #181c2b, #121520);
  }
  .sch-day-label { font-family:var(--mono); font-size:13px; font-weight:700; color:#ffffff; }
  .sch-day-date { font-family:var(--mono); font-size:11px; color:#94a3b8; }
  .sch-day-hours { font-family:var(--mono); font-size:11.5px; color:var(--acc3); font-weight:700; margin-left:auto; }

  .sch-day-body { display:flex; gap:0; background:#0a0c12; overflow:hidden; }
  .sch-axis {
    width:42px; flex-shrink:0; position:relative;
    border-right:1px solid var(--brd); background:#0d0f17;
  }
  .sch-axis-label {
    position:absolute; right:4px; font-family:var(--mono);
    font-size:9.5px; font-weight:700; color:#cbd5e1;
    transform:translateY(-50%); white-space:nowrap;
  }
  .sch-axis-half { position:absolute; right:0; left:0; height:1px; background:var(--brd); opacity:.4; }

  .sch-rooms-cols { display:flex; flex:1; gap:0; overflow-x:auto; min-width:0; }
  .sch-room-col { flex:1; min-width:140px; position:relative; border-right:1px solid var(--brd); }
  .sch-room-col:last-child { border-right:none; }
  .sch-room-col-header {
    position:sticky; top:0; z-index:2; padding:5px 8px;
    font-size:11.5px; font-weight:700; color:#ffffff;
    text-align:center; font-family:var(--mono); letter-spacing:.3px;
  }
  .sch-col-slots { position:relative; cursor:crosshair; }
  .sch-slot-guide { position:absolute; left:0; right:0; height:1px; background:var(--brd); opacity:.3; }

  .sch-ghost-preview {
    position:absolute; left:2px; right:2px;
    border-radius:4px; pointer-events:none; z-index:8;
    border:1.5px dashed rgba(255,255,255,.8); box-sizing:border-box;
    padding:2px 6px; font-size:9.5px; font-family:var(--mono); color:#fff;
    display:flex; align-items:center; justify-content:space-between; gap:4px;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .sch-ghost-preview.clash {
    background:rgba(255,117,117,.45) !important;
    border-color:var(--danger) !important;
  }

  .sch-block {
    position:absolute; left:2px; right:2px;
    border-radius:5px; padding:2px 6px;
    cursor:pointer; user-select:none; overflow:hidden; z-index:1;
    transition:opacity .15s, box-shadow .15s, transform .1s;
    box-shadow:0 2px 5px rgba(0,0,0,.45); box-sizing:border-box;
  }
  .sch-block:hover { box-shadow:0 3px 10px rgba(0,0,0,.7); z-index:3; transform:translateY(-0.5px); }
  .sch-block.is-selected-to-move {
    outline:2px dashed #ffffff; outline-offset:1px;
    box-shadow:0 0 14px rgba(255,255,255,.8); z-index:10 !important;
  }
  .sch-block-main {
    display:flex; align-items:center; justify-content:space-between;
    gap:6px; width:100%; height:100%; box-sizing:border-box;
  }
  .sch-block-left { display:flex; align-items:center; gap:6px; min-width:0; flex:1; overflow:hidden; }
  .sch-block-right { display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .sch-block-title {
    font-size:11px; font-weight:700; color:#ffffff;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    line-height:1.15; text-shadow:0 1px 2px rgba(0,0,0,.6);
  }
  .sch-block-time {
    font-family:var(--mono); font-size:9px; font-weight:700;
    color:#f8fafc; line-height:1.1; white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);
  }
  .sch-block-dur {
    font-family:var(--mono); font-size:9px; font-weight:700;
    color:var(--acc3); line-height:1.1; white-space:nowrap;
    text-shadow:0 1px 2px rgba(0,0,0,.6);
  }
  .sch-block-del {
    background:rgba(0,0,0,.5); border:none; border-radius:3px;
    color:#ffffff; font-size:9.5px; width:16px; height:16px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; opacity:.85; transition:all .15s;
    flex-shrink:0; line-height:1; padding:0;
  }
  .sch-block:hover .sch-block-del { opacity:1; }
  .sch-block-del:hover {
    background:var(--danger) !important; transform:scale(1.15);
  }

  /* ── fotos (paso 2.7) ── */
  .ph-drop-zone {
    border:2px dashed var(--brd2); border-radius:14px;
    padding:28px 20px; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    color:#cbd5e1; font-size:13.5px; cursor:pointer;
    transition:all .2s; margin-bottom:18px; background:var(--surf2);
  }
  .ph-drop-zone:hover, .ph-drop-zone.ph-drop-over {
    border-color:var(--acc); background:rgba(56,189,248,.08);
  }
  .ph-hint { font-size:11px; color:#94a3b8; font-family:var(--mono); }
  .ph-browse { color:var(--acc); cursor:pointer; text-decoration:underline; font-weight:600; }
  .ph-grid {
    display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
    gap:14px; margin-bottom:8px;
  }
  .ph-card { display:flex; flex-direction:column; gap:8px; }
  .ph-img-wrap {
    position:relative; border-radius:10px; overflow:hidden;
    background:var(--surf2); aspect-ratio:4/3;
  }
  .ph-img-wrap img { width:100%; height:100%; object-fit:cover; display:block; }
  .ph-del {
    position:absolute; top:6px; right:6px;
    width:24px; height:24px; border-radius:50%;
    background:rgba(0,0,0,.6); border:none; color:#fff;
    font-size:14px; cursor:pointer; display:flex;
    align-items:center; justify-content:center;
    transition:background .15s;
  }
  .ph-del:hover { background:var(--danger); }
  .ph-caption { font-size:13px; color:#ffffff; }

  /* fotos en resumen */
  .ph-sum-grid {
    display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:12px; margin-bottom:16px;
  }
  .ph-sum-card { display:flex; flex-direction:column; gap:6px; }
  .ph-sum-card img { width:100%; border-radius:8px; object-fit:cover; aspect-ratio:4/3; background:var(--surf2); }
  .ph-sum-caption { font-size:12px; color:var(--txt2); line-height:1.4; }

  /* ── ingresos y gastos (paso 2.8) ── */
  .fi-sponsorship-row { padding:12px 0 14px; }
  .fi-table {
    width:100%; border-collapse:collapse; font-size:13px;
  }
  .fi-table th {
    text-align:left; font-family:var(--mono); font-size:10.5px;
    letter-spacing:.8px; text-transform:uppercase; color:#93c5fd; font-weight:700;
    padding:0 8px 10px; border-bottom:1px solid var(--brd);
  }
  .fi-table td { padding:6px 8px; border-bottom:1px solid var(--brd); vertical-align:middle; color:#ffffff; }
  .fi-table tfoot td { border-bottom:none; border-top:1px solid var(--brd2); }
  .fi-input {
    width:100%; background:transparent; color:#ffffff;
    border:1px solid transparent; border-radius:6px;
    padding:6px 8px; font-family:var(--sans); font-size:13px;
    transition:border-color .15s; outline:none; font-weight:500;
  }
  .fi-input:focus { border-color:var(--acc); background:var(--surf2); }
  .fi-input::placeholder { color:#94a3b8; }
  .fi-num { text-align:right; width:90px; }
  .fi-del-btn {
    background:none; border:none; color:var(--txt3);
    font-size:15px; cursor:pointer; padding:2px 6px;
    border-radius:4px; transition:color .15s;
  }
  .fi-del-btn:hover { color:var(--danger); }
  .fi-total-badge {
    font-family:var(--mono); font-size:12px; font-weight:700;
    padding:3px 10px; border-radius:20px; margin-left:auto;
  }
  .fi-income-badge  { color:var(--acc2); background:rgba(52,211,153,.15); }
  .fi-expense-badge { color:var(--acc3); background:rgba(251,191,36,.15); }
  .fi-total-cell { font-family:var(--mono); font-size:13px; font-weight:700; color:#ffffff; text-align:right; }
  .fi-balance-bar {
    background:var(--surf2); border:1px solid var(--brd);
    border-radius:10px; padding:12px 18px;
    display:flex; align-items:center; justify-content:flex-end;
  }
  .fi-balance-label {
    font-family:var(--mono); font-size:16px; font-weight:700;
  }

  /* ── summary paso 3 ── */
  .to-summary-card {
    background:var(--surf); border:1px solid var(--brd);
    border-radius:14px; margin-bottom:12px; overflow:hidden;
  }
  .to-sum-header {
    display:flex; align-items:center; gap:10px;
    padding:13px 18px; background:var(--surf2);
    border-bottom:1px solid var(--brd);
  }
  .to-sum-name { font-size:14.5px; font-weight:700; color:#ffffff; }
  .to-sum-rounds-badge {
    margin-left:auto; font-family:var(--mono); font-size:10.5px; font-weight:700;
    color:var(--acc); background:rgba(56,189,248,.12);
    border-radius:20px; padding:3px 10px;
  }
  .to-sum-rows { padding:12px 18px 14px; display:flex; flex-direction:column; gap:8px; }
  .to-sum-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .to-sum-rnd { font-size:13px; color:var(--acc3); font-weight:700; font-family:var(--mono); min-width:90px; }
  .to-sum-chip {
    font-family:var(--mono); font-size:11.5px; font-weight:600;
    color:#ffffff; background:var(--surf2); border:1px solid var(--brd);
    border-radius:6px; padding:3px 9px;
  }
  .to-sum-adv { color:var(--acc2); border-color:rgba(52,211,153,.3); background:rgba(52,211,153,.1); font-weight:700; }

  /* ── acciones y botones ── */
  .to-actions {
    display:flex; gap:12px; justify-content:flex-end;
    margin-top:28px; padding-top:20px; border-top:1px solid var(--brd);
  }
  .to-btn-primary {
    background:var(--acc); color:#08090d; border:none; border-radius:10px;
    padding:12px 28px; font-family:var(--mono); font-size:13px; font-weight:800;
    cursor:pointer; letter-spacing:.4px; transition:all .15s;
    box-shadow:0 2px 10px rgba(56,189,248,.3);
