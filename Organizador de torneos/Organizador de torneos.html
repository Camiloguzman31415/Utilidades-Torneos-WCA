        <div class="to-section-title">Horario <span class="to-section-badge">${state.name}</span></div>
        <p class="to-hint">Configura parámetros, revisa los tiempos estimados y arrastra los bloques al calendario.</p>
      </div>

      <div class="to-ev-block" style="margin-bottom:16px">
        <div class="to-evb-header" id="params-hdr" style="cursor:pointer">
          <span class="to-evb-name">⚙ Parámetros globales</span>
          <span class="to-evb-id" id="params-arr">▲</span>
        </div>
        <div id="params-body">
          <div class="sch-params-grid">
            <div class="to-field">
              <label class="to-label">Estaciones (E)</label>
              <input class="to-input" id="sch-stations" type="number" min="1" max="200" value="${sp.stations}">
            </div>
            <div class="to-field">
              <label class="to-label">Factor sobredimensionamiento (A)</label>
              <input class="to-input" id="sch-factor" type="number" min="1" max="5" step="0.05" value="${sp.overFactor}">
            </div>
          </div>
          <div class="to-field" style="margin:14px 16px 0">
            <label class="to-label">Salas / Rooms</label>
            <div id="sch-rooms-list" class="sch-rooms-list"></div>
            <button class="to-reg-tool" id="sch-add-room" style="margin-top:8px">+ Agregar sala</button>
          </div>
          <div class="to-field" style="margin:14px 16px 16px">
            <label class="to-label">Días del torneo</label>
            <div id="sch-days-list" class="sch-rooms-list"></div>
            <button class="to-reg-tool" id="sch-add-day" style="margin-top:8px">+ Agregar día</button>
          </div>
        </div>
      </div>

      <div class="to-ev-block" style="margin-bottom:16px">
        <div class="to-evb-header">
          <span class="to-evb-name">⏱ Tiempos estimados por ronda</span>
          <span class="to-evb-id" id="avg-status">Cargando…</span>
        </div>
        <div id="sch-times-wrap" style="padding:12px 18px 16px"></div>
      </div>

      <div class="to-ev-block" style="margin-bottom:16px">
        <div class="to-evb-header" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
          <div>
            <span class="to-evb-name">📅 Calendario</span>
            <span class="to-evb-id">Arrastra los bloques al horario</span>
          </div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <div style="display:flex;align-items:center;gap:4px;background:var(--surf2);border:1px solid var(--brd);border-radius:8px;padding:2px 4px;">
              <span style="font-size:10px;font-family:var(--mono);color:var(--txt3);padding-left:4px">📏 Vista:</span>
              <button type="button" class="sch-zoom-btn sch-zoom-compact" data-zoom="1.0" title="Vista ultra compacta">Compacto</button>
              <button type="button" class="sch-zoom-btn sch-zoom-normal active" data-zoom="1.25" title="Vista estándar">Normal</button>
              <button type="button" class="sch-zoom-btn sch-zoom-expanded" data-zoom="1.8" title="Vista amplia">Amplio</button>
            </div>
            <button type="button" class="to-btn-secondary" id="sch-btn-auto-fill" style="padding:5px 10px;font-size:11px;font-family:var(--mono);color:var(--acc);border-color:rgba(122,164,255,.35);font-weight:700" title="Distribuye todas las rondas y actividades automáticamente de forma aleatoria para testeo">
              🎲 Llenar (Test)
            </button>
            <button type="button" class="to-btn-secondary" id="sch-btn-clear-all" style="padding:5px 8px;font-size:11px;font-family:var(--mono);color:var(--danger);border-color:rgba(255,117,117,.3)" title="Quitar todos los bloques del horario">
              🗑 Limpiar
            </button>
          </div>
        </div>
        <div id="sch-selection-banner-wrap" style="padding:10px 16px 0"></div>
        <div id="sch-palette-wrap" style="padding:10px 16px 0"></div>
        <div id="sch-trash-wrap" style="padding:8px 16px 0"></div>
        <div id="sch-cal-wrap" style="padding:8px 16px 16px"></div>
      </div>

      <div class="to-actions">
        <button class="to-btn-secondary" id="to-back25">← Volver</button>
        <button class="to-btn-primary"   id="to-next25">Ver resumen →</button>
      </div>
    `;

    /* ── Parámetros toggle ── */
    let paramsOpen = true;
    body.querySelector('#params-hdr').addEventListener('click', () => {
      paramsOpen = !paramsOpen;
      body.querySelector('#params-body').style.display = paramsOpen ? '' : 'none';
      body.querySelector('#params-arr').textContent = paramsOpen ? '▲' : '▼';
    });

    /* ── Salas ── */
    function renderRooms() {
      const list = body.querySelector('#sch-rooms-list');
      list.innerHTML = '';
      sp.rooms.forEach((r, i) => {
        const row = document.createElement('div');
        row.className = 'sch-room-row';
        row.innerHTML = `
          <div class="sch-room-color" style="background:${ROOM_COLORS[i % ROOM_COLORS.length]}"></div>
          <input class="to-input sch-room-input" value="${r}">
          ${sp.rooms.length > 1 ? `<button class="sch-room-del">×</button>` : ''}
        `;
        row.querySelector('input').addEventListener('input', e => { sp.rooms[i] = e.target.value; renderCalendar(); });
        row.querySelector('.sch-room-del')?.addEventListener('click', () => {
          sp.rooms.splice(i, 1);
          state.schedule = state.schedule.filter(b => b.roomIdx < sp.rooms.length);
          renderRooms(); renderCalendar();
        });
        list.appendChild(row);
      });
    }
    body.querySelector('#sch-add-room').addEventListener('click', () => {
      sp.rooms.push('Sala ' + (sp.rooms.length + 1));
      renderRooms(); renderCalendar();
    });

    /* ── Días ── */
    function renderDays() {
      const list = body.querySelector('#sch-days-list');
      list.innerHTML = '';
      sp.days.forEach((d, i) => {
        const row = document.createElement('div');
        row.className = 'sch-room-row';
        row.innerHTML = `
          <input class="to-input sch-room-input" value="${d.label}" data-f="label">
          <input class="to-input" style="width:145px;flex-shrink:0" type="date" value="${d.date}" data-f="date">
          <input class="to-input" style="width:72px;flex-shrink:0" type="number" min="0" max="23" value="${d.startHour}" data-f="startHour" title="Hora inicio">
          <span style="color:var(--txt3);font-size:12px;padding:0 2px;align-self:center">→</span>
          <input class="to-input" style="width:72px;flex-shrink:0" type="number" min="1" max="24" value="${d.endHour}" data-f="endHour" title="Hora fin">
          ${sp.days.length > 1 ? `<button class="sch-room-del">×</button>` : ''}
        `;
        row.querySelectorAll('[data-f]').forEach(el => el.addEventListener('change', e => {
          const f = e.target.dataset.f;
          sp.days[i][f] = f === 'label' ? e.target.value : +e.target.value;
          renderCalendar();
        }));
        row.querySelector('.sch-room-del')?.addEventListener('click', () => {
          sp.days.splice(i, 1);
          state.schedule = state.schedule.filter(b => b.dayIdx < sp.days.length);
          renderDays(); renderCalendar();
        });
        list.appendChild(row);
      });
    }
    body.querySelector('#sch-add-day').addEventListener('click', () => {
      const last = sp.days[sp.days.length - 1];
      const nd = new Date(last.date + 'T12:00:00'); nd.setDate(nd.getDate() + 1);
      sp.days.push({ date: nd.toISOString().slice(0,10), label: 'Día '+(sp.days.length+1), startHour: last.startHour, endHour: last.endHour });
      renderDays(); renderCalendar();
    });

    body.querySelector('#sch-stations').addEventListener('input', e => { sp.stations = +e.target.value||8; renderTimesTable(); renderCalendar(); });
    body.querySelector('#sch-factor').addEventListener('input',   e => { sp.overFactor= +e.target.value||1.2; renderTimesTable(); renderCalendar(); });

    /* ── Cálculo de duración de ronda (Automático y Personalizado) ── */
    function calcAutoDur(eid, ri) {
      const rd = state.rounds[eid]?.[ri];
      const n = (rd && FORMAT_ATTEMPTS_MAP[rd.format]) || 3;

      // Fewest Moves (333fm): cada intento dura 60 min (1 hora)
      if (eid === '333fm') {
        return 60; // 60 min por cada intento individual
      }

      if (!rd) return 15;
      const T = +(state.eventAvgSec[eid] || 60);
      let C = +(state.competitorLimit || 80);
      for (let k = 0; k < ri; k++) {
        const prev = state.rounds[eid][k];
        if (prev?.advance) C = prev.advanceType === 'p' ? Math.ceil(C * prev.advance/100) : Math.min(C, +prev.advance);
      }
      const rawMins = (n * (T + 15) * C * sp.overFactor) / (sp.stations * 60);
      // Redondear siempre hacia arriba al próximo múltiplo de 5 (ej: 113 -> 115 min)
      const mins = Math.max(5, Math.ceil(rawMins / 5) * 5);
      return mins;
    }

    function calcDur(eid, ri) {
      if (state.customRoundDuration?.[eid]?.[ri] != null && state.customRoundDuration[eid][ri] !== '') {
        return state.customRoundDuration[eid][ri];
      }
      return calcAutoDur(eid, ri);
    }

    function syncPlacedRoundsDuration() {
      state.schedule.forEach(bl => {
        if (!bl.isCustom && bl.eventId) {
          bl.durationMin = calcDur(bl.eventId, bl.roundIdx);
        }
      });
    }

    /* ── Tabla de tiempos estimados y personalizados ── */
    function renderTimesTable() {
      const wrap = body.querySelector('#sch-times-wrap'); if (!wrap) return;
      if (!state.customRoundDuration) state.customRoundDuration = {};

      let html = `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap">
          <span style="font-size:12px;color:var(--txt2)">
            Ajusta el <strong>T prom. (s)</strong> o escribe los <strong>minutos</strong> de cada ronda. Pulsa <strong>Enter</strong> o <strong>✓</strong> para confirmar.
          </span>
          <span id="sch-times-feedback" style="font-size:12px;color:var(--acc2);font-family:var(--mono);display:none;font-weight:600">
            ✓ ¡Tiempos actualizados!
          </span>
        </div>
        <div class="sch-times-head">
          <span>Evento</span>
          <span>T prom. (s)</span>
          <span>Duración por ronda (minutos)</span>
        </div>
      `;

      ordered.forEach(ev => {
        const T = state.eventAvgSec[ev.id] || 0;
        const roundsList = state.rounds[ev.id] || [];

        let roundsHtml = '';
        roundsList.forEach((rd, i) => {
          const autoD = calcAutoDur(ev.id, i);
          const customD = state.customRoundDuration[ev.id]?.[i];
          const isCustom = customD != null && customD !== '';

          roundsHtml += `
            <div class="sch-round-dur-item ${isCustom ? 'is-custom' : ''}" data-eid="${ev.id}" data-ri="${i}" title="${isCustom ? 'Duración manual fijada para esta ronda' : 'Duración automática ('+autoD+' min). Escribe un número y pulsa Enter o ✓ para fijar'}">
              <span class="sch-round-dur-lbl">R${i+1}:</span>
              <input class="sch-round-dur-input" 
                     type="number" min="5" max="480" step="5"
                     value="${isCustom ? customD : ''}" 
                     placeholder="${autoD}" 
                     data-eid="${ev.id}" data-ri="${i}"
                     title="Duración en minutos para R${i+1} (Enter o clic en ✓ para confirmar)">
              <span style="font-size:10px;color:var(--txt3)">min</span>
              <button type="button" class="sch-round-btn sch-round-btn-save" data-eid="${ev.id}" data-ri="${i}" title="Confirmar duración (Enter)">✓</button>
              ${isCustom ? `<button type="button" class="sch-round-btn sch-round-btn-reset" data-eid="${ev.id}" data-ri="${i}" title="Restablecer a tiempo automático (${autoD} min)">✕</button>` : ''}
            </div>
          `;
        });

        html += `
          <div class="sch-times-row">
            <span class="sch-ev-label" style="font-weight:500">${ev.name}</span>
            <div style="display:flex;align-items:center;gap:4px">
              <input class="to-input sch-t-input" type="number" min="1" step="0.5" value="${T||''}" placeholder="auto" data-eid="${ev.id}" title="Tiempo promedio en segundos (Enter o ✓ para confirmar)">
              <button type="button" class="sch-t-btn-save" data-eid="${ev.id}" title="Confirmar T prom">✓</button>
            </div>
            <div class="sch-chips">${roundsHtml}</div>
          </div>
        `;
      });

      html += `
        <div style="display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:14px;padding-top:10px;border-top:1px solid var(--brd)">
          <button type="button" class="to-btn-secondary" id="sch-btn-apply-all" style="padding:7px 18px;font-size:12px;font-family:var(--mono);color:var(--acc2);border-color:rgba(77,255,192,.3);font-weight:700">
            ✓ Confirmar y Actualizar Horario
          </button>
        </div>
      `;

      wrap.innerHTML = html;

      function showFeedback(msg) {
        const fb = wrap.querySelector('#sch-times-feedback');
        if (fb) {
          fb.textContent = msg || '✓ ¡Tiempos actualizados!';
          fb.style.display = 'inline-block';
          setTimeout(() => { if (fb) fb.style.display = 'none'; }, 2400);
        }
      }

      function applyRoundInput(inp) {
        const eid = inp.dataset.eid;
        const ri = parseInt(inp.dataset.ri);
        const val = inp.value.trim();

        if (!state.customRoundDuration[eid]) state.customRoundDuration[eid] = {};

        if (val === '' || isNaN(parseInt(val))) {
          delete state.customRoundDuration[eid][ri];
        } else {
          const mins = Math.max(5, parseInt(val));
          state.customRoundDuration[eid][ri] = mins;
          inp.value = mins;
        }

        syncPlacedRoundsDuration();
        renderTimesTable(); renderPalette(); renderCalendar();
        showFeedback('✓ R' + (ri+1) + ' fijada en ' + (state.customRoundDuration[eid]?.[ri] || calcAutoDur(eid, ri)) + ' min');
      }

      function applyTInput(inp) {
        const eid = inp.dataset.eid;
        const v = parseFloat(inp.value);
        if (!isNaN(v) && v > 0) state.eventAvgSec[eid] = v;
        else delete state.eventAvgSec[eid];
        syncPlacedRoundsDuration();
        renderTimesTable(); renderPalette(); renderCalendar();
        showFeedback('✓ T prom. de ' + eid + ' actualizado');
      }

      // Eventos de T prom
      wrap.querySelectorAll('.sch-t-input').forEach(inp => {
        inp.addEventListener('keydown', e => {
          if (e.key === 'Enter') {
            e.preventDefault();
            applyTInput(inp);
          }
        });
        inp.addEventListener('change', () => applyTInput(inp));
      });

      wrap.querySelectorAll('.sch-t-btn-save').forEach(btn => {
        btn.addEventListener('click', () => {
          const inp = wrap.querySelector(`.sch-t-input[data-eid="${btn.dataset.eid}"]`);
          if (inp) applyTInput(inp);
        });
      });

      // Eventos de Duraciones Manuales por Ronda
      wrap.querySelectorAll('.sch-round-dur-input').forEach(inp => {
        inp.addEventListener('keydown', e => {
          if (e.key === 'Enter') {
            e.preventDefault();
            applyRoundInput(inp);
          }
        });
        inp.addEventListener('change', () => applyRoundInput(inp));
      });

      // Botón ✓ de cada ronda
      wrap.querySelectorAll('.sch-round-btn-save').forEach(btn => {
        btn.addEventListener('click', () => {
          const inp = wrap.querySelector(`.sch-round-dur-input[data-eid="${btn.dataset.eid}"][data-ri="${btn.dataset.ri}"]`);
          if (inp) applyRoundInput(inp);
        });
      });

      // Botón ✕ restablecer a automático
      wrap.querySelectorAll('.sch-round-btn-reset').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const eid = btn.dataset.eid;
          const ri = parseInt(btn.dataset.ri);
          if (state.customRoundDuration?.[eid]) {
            delete state.customRoundDuration[eid][ri];
          }
          syncPlacedRoundsDuration();
          renderTimesTable(); renderPalette(); renderCalendar();
          showFeedback('✓ Ronda restablecida a cálculo automático');
        });
      });

      // Botón general confirmar todo
      wrap.querySelector('#sch-btn-apply-all')?.addEventListener('click', () => {
        wrap.querySelectorAll('.sch-round-dur-input').forEach(inp => {
          const eid = inp.dataset.eid;
          const ri = parseInt(inp.dataset.ri);
          const val = inp.value.trim();
          if (val !== '' && !isNaN(parseInt(val))) {
            if (!state.customRoundDuration[eid]) state.customRoundDuration[eid] = {};
            state.customRoundDuration[eid][ri] = Math.max(5, parseInt(val));
          }
        });
        syncPlacedRoundsDuration();
        renderTimesTable(); renderPalette(); renderCalendar();
        showFeedback('✓ ¡Todos los tiempos y el calendario han sido actualizados!');
      });
    }

    /* ── Paleta de bloques pendientes (Rondas + Actividades Personalizadas) ── */
    let selectedItem = null; // { origin: 'palette'|'calendar', type, eventId, roundIdx, attemptIdx, isFMC, name, durationMin, color, blockId }

    function renderSelectionBanner() {
      const bannerWrap = body.querySelector('#sch-selection-banner-wrap');
      if (!bannerWrap) return;
      if (!selectedItem) {
        bannerWrap.innerHTML = '';
        return;
      }

      const title = selectedItem.name;
      const dur = selectedItem.durationMin;
      const ds = dur >= 60 ? Math.floor(dur/60)+'h'+(dur%60?String(dur%60).padStart(2,'0')+'m':'') : dur+'min';
      const isMove = selectedItem.origin === 'calendar';

      bannerWrap.innerHTML = `
        <div class="sch-selection-banner">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:14px">${isMove ? '🔄' : '🎯'}</span>
            <span>
              <strong>${isMove ? 'Moviendo:' : 'Seleccionado:'}</strong> ${title} (${ds})
              <span style="opacity:.8;font-size:11px;margin-left:6px">— Haz clic en una columna del horario para ${isMove ? 'moverlo' : 'colocarlo'}</span>
            </span>
          </div>
          <button type="button" id="sch-cancel-selection" style="background:none;border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:4px;padding:2px 8px;font-size:11px;cursor:pointer">
            Cancelar (Esc)
          </button>
        </div>
      `;

      bannerWrap.querySelector('#sch-cancel-selection')?.addEventListener('click', () => {
        selectedItem = null;
        renderAll();
      });
    }

    function renderPalette() {
      const wrap = body.querySelector('#sch-palette-wrap'); if (!wrap) return;
      wrap.innerHTML = '';

      if (!state.customActivities) {
        state.customActivities = [
          { id: 'act_almuerzo', name: '🍱 Almuerzo', durationMin: 60, color: '#f59e0b' },
          { id: 'act_registro', name: '📋 Registro y Acreditación', durationMin: 30, color: '#10b981' },
          { id: 'act_tutorial', name: '💡 Tutorial Nuevos Competidores', durationMin: 15, color: '#8b5cf6' },
          { id: 'act_premios',  name: '🏆 Entrega de Premios', durationMin: 30, color: '#ffd700' }
        ];
      }

      const pending = [];
      ordered.forEach(ev => {
        const rounds = state.rounds[ev.id] || [];
        rounds.forEach((rd, ri) => {
          if (ev.id === '333fm') {
            const n = FORMAT_ATTEMPTS_MAP[rd.format] || 3;
            for (let ai = 0; ai < n; ai++) {
              const isPlaced = state.schedule.some(b =>
                !b.isCustom && b.eventId === '333fm' && b.roundIdx === ri &&
                (b.attemptIdx === ai || (n === 1 && b.attemptIdx == null))
              );
              if (!isPlaced) {
                pending.push({ ev, ri, ai, isFMC: true, totalAttempts: n });
              }
            }
          } else {
            const isPlaced = state.schedule.some(b => !b.isCustom && b.eventId === ev.id && b.roundIdx === ri);
            if (!isPlaced) {
              pending.push({ ev, ri, ai: null, isFMC: false });
            }
          }
        });
      });

      const palContainer = document.createElement('div');
      palContainer.style.cssText = 'display:flex;flex-direction:column;gap:14px;';

      // ── SECCIÓN 1: RONDAS OFICIALES ──
      const secRounds = document.createElement('div');
      secRounds.innerHTML = '<div class="sch-palette-label">Rondas Oficiales — Haz clic para seleccionar y clic en el horario para colocar (o arrastra)</div>';
      
      if (pending.length === 0) {
        const emptyRounds = document.createElement('div');
        emptyRounds.className = 'sch-palette-empty';
        emptyRounds.textContent = '✓ Todas las rondas oficiales e intentos están en el horario';
        secRounds.appendChild(emptyRounds);
      } else {
        const gridRounds = document.createElement('div');
        gridRounds.className = 'sch-palette-grid';
        pending.forEach(({ev, ri, ai, isFMC}) => {
          const dur = calcDur(ev.id, ri);
          const ds = dur >= 60 ? Math.floor(dur/60)+'h'+(dur%60?String(dur%60).padStart(2,'0')+'m':'') : dur+'min';
          const color = EVENT_COLORS[state.selectedEvents.indexOf(ev.id) % EVENT_COLORS.length];
          const chip = document.createElement('div');
          
          const isThisSelected = selectedItem && selectedItem.origin === 'palette' && selectedItem.type === 'new' &&
                                 selectedItem.eventId === ev.id && selectedItem.roundIdx === ri && selectedItem.attemptIdx === ai;

          chip.className = 'sch-pal-chip ' + (isThisSelected ? 'is-selected' : '');
          chip.draggable = true;
          chip.style.borderLeft = `3px solid ${color}`;
          
          const rTitle = isFMC ? `R${ri+1} · Int.${ai+1}` : `R${ri+1}`;
          const fullName = isFMC ? `${ev.name} · R${ri+1} (Intento ${ai+1})` : `${ev.name} · R${ri+1}`;
          
          chip.innerHTML = `<span class="sch-pal-name">${ev.name}</span><span class="sch-pal-round">${rTitle}</span><span class="sch-pal-dur">${ds}</span>`;
          
          // Click para seleccionar
          chip.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isThisSelected) {
              selectedItem = null;
            } else {
              selectedItem = {
                origin: 'palette',
                type: 'new',
                eventId: ev.id,
                roundIdx: ri,
                attemptIdx: isFMC ? ai : null,
                isFMC,
                name: fullName,
                durationMin: dur,
                color
              };
            }
            renderAll();
          });

          // Drag para arrastrar tradicional
          chip.addEventListener('dragstart', e => {
            selectedItem = null;
            e.dataTransfer.setData('text/plain', JSON.stringify({
              type: 'new',
              eventId: ev.id,
              roundIdx: ri,
              attemptIdx: isFMC ? ai : null,
              isFMC
            }));
          });

          gridRounds.appendChild(chip);
        });
        secRounds.appendChild(gridRounds);
      }
      palContainer.appendChild(secRounds);

      // ── SECCIÓN 2: ACTIVIDADES ADICIONALES ──
      const secCustom = document.createElement('div');
      secCustom.style.cssText = 'border-top:1px solid var(--brd);padding-top:12px;';
      secCustom.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap">
          <div class="sch-palette-label" style="margin-bottom:0">Bloques Adicionales (Almuerzo, Registro, Premios...)</div>
          <span style="font-size:10.5px;color:var(--txt3);font-family:var(--mono)">Haz clic para seleccionar y colocar</span>

      formBox.innerHTML = `
        <div style="flex:1;min-width:160px">
          <input class="to-input" id="sch-custom-name" placeholder="Nombre de actividad..." style="padding:5px 10px;font-size:12px" />
        </div>
        <div style="display:flex;align-items:center;gap:4px">
          <label style="font-size:10.5px;color:var(--txt3);font-family:var(--mono)">Duración:</label>
          <input class="to-input" id="sch-custom-dur" type="number" min="5" max="360" step="5" value="60" style="width:60px;padding:5px 6px;font-size:12px;text-align:center" />
          <span style="font-size:10.5px;color:var(--txt3);font-family:var(--mono)">min</span>
        </div>
        <div style="display:flex;align-items:center;gap:4px">
          <label style="font-size:10.5px;color:var(--txt3);font-family:var(--mono)">Color:</label>
          <select class="to-select" id="sch-custom-color" style="padding:5px 24px 5px 8px;font-size:11px;width:auto">
            <option value="#f59e0b">🟡 Ámbar</option>
            <option value="#10b981">🟢 Verde</option>
            <option value="#3b82f6">🔵 Azul</option>
            <option value="#8b5cf6">🟣 Morado</option>
            <option value="#ef4444">🔴 Rojo</option>
            <option value="#ffd700">🏆 Dorado</option>
            <option value="#71717a">⚪ Gris</option>
          </select>
        </div>
        <button class="to-btn-secondary" id="sch-btn-add-custom" style="padding:5px 12px;font-size:11px;font-family:var(--mono);font-weight:700;color:var(--acc);border-color:var(--acc-dim);white-space:nowrap">
          + Agregar
        </button>
      `;

      // Sugerencias rápidas (Presets)
      const presetsWrap = document.createElement('div');
      presetsWrap.style.cssText = 'display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;align-items:center;';
      presetsWrap.innerHTML = '<span style="font-size:10px;color:var(--txt3);font-family:var(--mono);margin-right:2px">Sugerencias:</span>';
      
      const PRESETS = [
        { name: '🍱 Almuerzo', dur: 60, col: '#f59e0b' },
        { name: '📋 Registro y Acreditación', dur: 30, col: '#10b981' },
        { name: '💡 Tutorial Nuevos', dur: 15, col: '#8b5cf6' },
        { name: '🏆 Entrega de Premios', dur: 30, col: '#ffd700' },
        { name: '🎤 Apertura', dur: 20, col: '#3b82f6' },
        { name: '☕ Break', dur: 15, col: '#71717a' },
      ];

      PRESETS.forEach(pr => {
        const prBtn = document.createElement('button');
        prBtn.className = 'to-btn-secondary';
        prBtn.style.cssText = 'padding:2px 6px;font-size:10.5px;border-radius:5px;';
        prBtn.textContent = pr.name;
        prBtn.addEventListener('click', () => {
          formBox.querySelector('#sch-custom-name').value = pr.name;
          formBox.querySelector('#sch-custom-dur').value  = pr.dur;
          formBox.querySelector('#sch-custom-color').value = pr.col;
        });
        presetsWrap.appendChild(prBtn);
      });

      // Grid de chips de actividades
      const gridCustom = document.createElement('div');
      gridCustom.className = 'sch-palette-grid';

      function renderCustomChips() {
        gridCustom.innerHTML = '';
        state.customActivities.forEach((act, idx) => {
          const ds = act.durationMin >= 60
            ? Math.floor(act.durationMin/60)+'h'+(act.durationMin%60?String(act.durationMin%60).padStart(2,'0')+'m':'')
            : act.durationMin+'min';
          const chip = document.createElement('div');
          
          const isThisSelected = selectedItem && selectedItem.origin === 'palette' && selectedItem.type === 'custom' && selectedItem.name === act.name;

          chip.className = 'sch-pal-chip ' + (isThisSelected ? 'is-selected' : '');
          chip.draggable = true;
          chip.style.borderLeft = `3px solid ${act.color}`;
          chip.innerHTML = `
            <span class="sch-pal-name" style="font-weight:600">${act.name}</span>
            <span class="sch-pal-dur" style="color:var(--acc2);background:rgba(77,255,192,.08);padding:1px 5px;border-radius:4px">${ds}</span>
            <span class="sch-del-custom" title="Eliminar actividad" style="color:var(--txt3);cursor:pointer;font-size:11px;padding:0 2px;margin-left:2px">✕</span>
          `;
          
          // Click para seleccionar
          chip.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isThisSelected) {
              selectedItem = null;
            } else {
              selectedItem = {
                origin: 'palette',
                type: 'custom',
                name: act.name,
                durationMin: act.durationMin,
                color: act.color
              };
            }
            renderAll();
          });

          chip.addEventListener('dragstart', e => {
            selectedItem = null;
            e.dataTransfer.setData('text/plain', JSON.stringify({
              type: 'custom',
              name: act.name,
              durationMin: act.durationMin,
              color: act.color
            }));
          });

          chip.querySelector('.sch-del-custom').addEventListener('click', (e) => {
            e.stopPropagation();
            state.customActivities.splice(idx, 1);
            if (selectedItem?.name === act.name) selectedItem = null;
            renderAll();
          });
          gridCustom.appendChild(chip);
        });
      }

      renderCustomChips();

      formBox.querySelector('#sch-btn-add-custom').addEventListener('click', () => {
        const nameInp = formBox.querySelector('#sch-custom-name');
        const durInp  = formBox.querySelector('#sch-custom-dur');
        const colInp  = formBox.querySelector('#sch-custom-color');
        const name = nameInp.value.trim();
        const dur  = Math.max(5, parseInt(durInp.value) || 30);
        const col  = colInp.value || '#f59e0b';
        if (!name) { alert('Por favor ingresa un nombre para la actividad.'); return; }

        state.customActivities.push({
          id: 'act_' + Date.now() + Math.random().toString(36).slice(2, 5),
          name,
          durationMin: dur,
          color: col
        });

        nameInp.value = '';
        renderAll();
      });

      secCustom.appendChild(presetsWrap);
      secCustom.appendChild(formBox);
      secCustom.appendChild(gridCustom);
      palContainer.appendChild(secCustom);

      wrap.appendChild(palContainer);

    /* ── Trash ── */
    function renderTrash() {
      const wrap = body.querySelector('#sch-trash-wrap'); if (!wrap) return;
      if (state.schedule.length === 0) { wrap.innerHTML = ''; return; }
      wrap.innerHTML = '<div class="sch-trash" id="sch-trash-zone">🗑 Arrastra aquí para quitar del horario (o usa la ✕ en cada bloque)</div>';
      const trash = wrap.querySelector('#sch-trash-zone');
      trash.addEventListener('dragover', e => { e.preventDefault(); trash.classList.add('over'); });
      trash.addEventListener('dragleave', () => trash.classList.remove('over'));
      trash.addEventListener('drop', e => {
        e.preventDefault(); trash.classList.remove('over');
        try {
          const d = JSON.parse(e.dataTransfer.getData('text/plain'));
          if (d.blockId) { state.schedule = state.schedule.filter(b => b.id !== d.blockId); renderAll(); }
        } catch(err) {}
      });
    }

    /* ── Calendario con Click-to-Place y Ghost Preview ── */
    function renderCalendar() {
      const wrap = body.querySelector('#sch-cal-wrap'); if (!wrap) return;
      wrap.innerHTML = '';
      renderSelectionBanner();

      sp.days.forEach((day, dayIdx) => {
        const totalMin = (day.endHour - day.startHour) * 60;
        const totalPx  = totalMin * SLOT_H_PX;

        const dayDiv = document.createElement('div');
        dayDiv.className = 'sch-day';
        dayDiv.innerHTML = `
          <div class="sch-day-header">
            <span class="sch-day-label">${day.label}</span>
            <span class="sch-day-date">${day.date}</span>
            <span class="sch-day-hours">${day.startHour}:00 → ${day.endHour}:00</span>
          </div>
          <div class="sch-day-body">
            <div class="sch-axis" style="height:${totalPx}px">${buildAxis(day.startHour, day.endHour)}</div>
            <div class="sch-rooms-cols" id="cols-${dayIdx}">
              ${sp.rooms.map((rm, ri) => `
                <div class="sch-room-col" data-day="${dayIdx}" data-room="${ri}">
                  <div class="sch-room-col-header" style="background:${ROOM_COLORS[ri%ROOM_COLORS.length]}22;border-bottom:2px solid ${ROOM_COLORS[ri%ROOM_COLORS.length]}">${rm}</div>
                  <div class="sch-col-slots" id="slot-${dayIdx}-${ri}" style="position:relative;height:${totalPx}px" data-day="${dayIdx}" data-room="${ri}">
                    ${buildGuides(totalMin)}
                    <div class="sch-ghost-preview" style="display:none"></div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
        wrap.appendChild(dayDiv);

        /* Eventos de Click y Hover en cada Sala */
        sp.rooms.forEach((_, ri) => {
          const slotDiv = dayDiv.querySelector(`#slot-${dayIdx}-${ri}`);
          const ghostEl = slotDiv.querySelector('.sch-ghost-preview');

          // Hover / Mousemove: Vista previa (Ghost Block) si hay selección activa
          slotDiv.addEventListener('mousemove', e => {
            if (!selectedItem) {
              if (ghostEl) ghostEl.style.display = 'none';
              return;
            }
            const rect = slotDiv.getBoundingClientRect();
            const rawMin = (e.clientY - rect.top) / SLOT_H_PX;
            const dur = selectedItem.durationMin;
            const skipId = selectedItem.origin === 'calendar' ? selectedItem.blockId : null;
            const tentStart = snapToFreeSlot(Math.max(0, rawMin), dur, dayIdx, ri, skipId);
            const tentEnd = tentStart + dur;

            const clash = state.schedule.some(b =>
              b.dayIdx === dayIdx && b.roomIdx === ri && b.id !== skipId &&
              tentStart < b.startMin + b.durationMin && tentEnd > b.startMin
            );

            if (ghostEl) {
              ghostEl.style.display = 'flex';
              ghostEl.style.top = (tentStart * SLOT_H_PX) + 'px';
              ghostEl.style.height = Math.max(dur * SLOT_H_PX, 18) + 'px';
              ghostEl.style.background = clash ? 'rgba(255,117,117,.35)' : (selectedItem.color || '#7aa4ff') + '55';
              ghostEl.classList.toggle('clash', clash);
              
              const sh = day.startHour + Math.floor(tentStart/60), sm = tentStart%60;
              const em = tentStart + dur;
              const eh = day.startHour + Math.floor(em/60), emm = em%60;
              const ts = `${String(sh).padStart(2,'0')}:${String(sm).padStart(2,'0')}–${String(eh).padStart(2,'0')}:${String(emm).padStart(2,'0')}`;

              ghostEl.innerHTML = `
                <span style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${clash ? '✕ Ocupado' : selectedItem.name}</span>
                <span style="opacity:.9">${ts}</span>
              `;
            }
          });

          slotDiv.addEventListener('mouseleave', () => {
            if (ghostEl) ghostEl.style.display = 'none';
          });

          // Click para colocar / soltar bloque
          slotDiv.addEventListener('click', e => {
            if (!selectedItem) return;
            if (e.target.closest('.sch-block-del')) return;

            const rect = slotDiv.getBoundingClientRect();
            const rawMin = (e.clientY - rect.top) / SLOT_H_PX;
            const dur = selectedItem.durationMin;
            const skipId = selectedItem.origin === 'calendar' ? selectedItem.blockId : null;
            const startMin = snapToFreeSlot(Math.max(0, rawMin), dur, dayIdx, ri, skipId);
            const endMin = startMin + dur;

            const clash = state.schedule.some(b =>
              b.dayIdx === dayIdx && b.roomIdx === ri && b.id !== skipId &&
              startMin < b.startMin + b.durationMin && endMin > b.startMin
            );

            if (clash) {
              slotDiv.classList.add('drop-rejected');
              setTimeout(() => slotDiv.classList.remove('drop-rejected'), 600);
              return;
            }

            if (selectedItem.origin === 'palette') {
              if (selectedItem.type === 'new') {
                state.schedule.push({
                  id: 'b' + Date.now() + Math.random().toString(36).slice(2, 5),
                  isCustom: false,
                  eventId: selectedItem.eventId,
                  roundIdx: selectedItem.roundIdx,
                  attemptIdx: selectedItem.attemptIdx,
                  roomIdx: ri,
                  dayIdx,
                  startMin,
                  durationMin: dur
                });
                selectedItem = null;
              } else if (selectedItem.type === 'custom') {
                state.schedule.push({
                  id: 'b' + Date.now() + Math.random().toString(36).slice(2, 5),
                  isCustom: true,
                  customName: selectedItem.name,
                  color: selectedItem.color || '#f59e0b',
                  roomIdx: ri,
                  dayIdx,
                  startMin,
                  durationMin: dur
                });
              }
            } else if (selectedItem.origin === 'calendar') {
              const bl = state.schedule.find(b => b.id === selectedItem.blockId);
              if (bl) {
                bl.dayIdx = dayIdx;
                bl.roomIdx = ri;
                bl.startMin = startMin;
              }
              selectedItem = null;
            }

            renderAll();
          });

          // Soporte Drag & Drop tradicional
          slotDiv.addEventListener('dragover', e => {
            e.preventDefault();
            try {
              const d = JSON.parse(e.dataTransfer.getData('text/plain'));
              let dur;
              if (d.type === 'new') dur = calcDur(d.eventId, d.roundIdx);
              else if (d.type === 'custom') dur = d.durationMin || 30;
              else dur = (state.schedule.find(b => b.id === d.blockId)?.durationMin || 30);

              const rect = slotDiv.getBoundingClientRect();
              const rawMin = (e.clientY - rect.top) / SLOT_H_PX;
              const tentStart = snapToFreeSlot(Math.max(0, rawMin - (d.offsetMin||0)), dur, dayIdx, ri, d.blockId||null);
              const tentEnd   = tentStart + dur;
              const skipId    = d.blockId || null;
              const clash = state.schedule.some(b =>
                b.dayIdx === dayIdx && b.roomIdx === ri && b.id !== skipId &&
                tentStart < b.startMin + b.durationMin && tentEnd > b.startMin
              );
              slotDiv.classList.toggle('drag-over', !clash);
              slotDiv.classList.toggle('drag-clash', clash);
            } catch(e2) { slotDiv.classList.add('drag-over'); }
          });

          slotDiv.addEventListener('dragleave', () => {
            slotDiv.classList.remove('drag-over');
            slotDiv.classList.remove('drag-clash');
          });

          slotDiv.addEventListener('drop', e => {
            e.preventDefault();
            slotDiv.classList.remove('drag-over');
            slotDiv.classList.remove('drag-clash');
            try {
              const d = JSON.parse(e.dataTransfer.getData('text/plain'));
              const rect     = slotDiv.getBoundingClientRect();
              const rawMin   = (e.clientY - rect.top) / SLOT_H_PX;
              const offsetMin = d.offsetMin || 0;

              let dur, skipId = null;
              if (d.type === 'new') {
                dur = calcDur(d.eventId, d.roundIdx);
              } else if (d.type === 'custom') {
                dur = d.durationMin || 30;
              } else {
                const movingBl = state.schedule.find(b => b.id === d.blockId);
                dur    = movingBl?.durationMin || 30;
                skipId = d.blockId;
              }

              const startMin = snapToFreeSlot(Math.max(0, rawMin - offsetMin), dur, dayIdx, ri, skipId);
              const endMin = startMin + dur;
              const clash = state.schedule.some(b =>
                b.dayIdx === dayIdx && b.roomIdx === ri && b.id !== skipId &&
                startMin < b.startMin + b.durationMin && endMin > b.startMin
              );

              if (clash) {
                slotDiv.classList.add('drop-rejected');
                setTimeout(() => slotDiv.classList.remove('drop-rejected'), 600);
                return;
              }

              if (d.type === 'new') {
                state.schedule.push({
                  id: 'b'+Date.now()+Math.random().toString(36).slice(2,5),
                  isCustom: false,
                  eventId: d.eventId, roundIdx: d.roundIdx,
                  attemptIdx: d.attemptIdx !== undefined ? d.attemptIdx : (d.eventId === '333fm' ? 0 : null),
                  roomIdx: ri, dayIdx, startMin, durationMin: dur
                });
              } else if (d.type === 'custom') {
                state.schedule.push({
                  id: 'b'+Date.now()+Math.random().toString(36).slice(2,5),
                  isCustom: true,
                  customName: d.name,
                  color: d.color || '#f59e0b',
                  roomIdx: ri, dayIdx, startMin, durationMin: dur
                });
              } else if (d.type === 'move' && d.blockId) {
                const bl = state.schedule.find(b => b.id === d.blockId);
                if (bl) { bl.dayIdx = dayIdx; bl.roomIdx = ri; bl.startMin = startMin; }
              }
              selectedItem = null;
              renderAll();
            } catch(err) { console.error(err); }
          });
        });
      });

      /* Render placed blocks */
      state.schedule.forEach(bl => {
        const slotDiv = body.querySelector(`#slot-${bl.dayIdx}-${bl.roomIdx}`); if (!slotDiv) return;
        const day = sp.days[bl.dayIdx];
        const isCust = bl.isCustom || !bl.eventId;
        const ev  = !isCust ? ALL_EVENTS.find(e => e.id === bl.eventId) : null;
        const isAttempt = !isCust && bl.eventId === '333fm' && bl.attemptIdx != null;
        const title = isCust ? bl.customName : (isAttempt ? `${ev ? ev.name : bl.eventId} · R${bl.roundIdx+1} (Int.${bl.attemptIdx+1})` : `${ev ? ev.name : bl.eventId} · R${bl.roundIdx+1}`);
        const color = isCust ? (bl.color || '#f59e0b') : EVENT_COLORS[state.selectedEvents.indexOf(bl.eventId) % EVENT_COLORS.length];
        const top    = bl.startMin * SLOT_H_PX;
        const height = Math.max(bl.durationMin * SLOT_H_PX, 16);
        const sh = day.startHour + Math.floor(bl.startMin/60), sm = bl.startMin%60;
        const em = bl.startMin + bl.durationMin;
        const eh = day.startHour + Math.floor(em/60), emm = em%60;
        const ts = `${String(sh).padStart(2,'0')}:${String(sm).padStart(2,'0')}–${String(eh).padStart(2,'0')}:${String(emm).padStart(2,'0')}`;
        const ds = bl.durationMin >= 60 ? Math.floor(bl.durationMin/60)+'h'+(bl.durationMin%60?String(bl.durationMin%60).padStart(2,'0')+'m':'') : bl.durationMin+'min';

        const isThisSelectedToMove = selectedItem && selectedItem.origin === 'calendar' && selectedItem.blockId === bl.id;

        const blEl = document.createElement('div');
        blEl.className = 'sch-block ' + (isThisSelectedToMove ? 'is-selected-to-move' : '');
        blEl.draggable = true;
        blEl.style.cssText = `top:${top}px;height:${height}px;background:${color};border-left:3px solid rgba(0,0,0,.35);`;
        
        blEl.innerHTML = `
          <div class="sch-block-main">
            <div class="sch-block-left">
              <span class="sch-block-title">${title}</span>
            </div>
            <div class="sch-block-right">
              <span class="sch-block-time">${ts}</span>
              <span class="sch-block-dur">${ds}</span>
              <button type="button" class="sch-block-del" title="Quitar del horario" data-bid="${bl.id}">✕</button>
            </div>
          </div>
        `;

        // Click en el bloque para mover
        blEl.addEventListener('click', (e) => {
          if (e.target.closest('.sch-block-del')) return;
          e.stopPropagation();
          if (isThisSelectedToMove) {
            selectedItem = null;
          } else {
            selectedItem = {
              origin: 'calendar',
              blockId: bl.id,
              name: title,
              durationMin: bl.durationMin,
              color
            };
          }
          renderAll();
        });

        blEl.querySelector('.sch-block-del')?.addEventListener('click', (e) => {
          e.stopPropagation();
          e.preventDefault();
          state.schedule = state.schedule.filter(b => b.id !== bl.id);
          if (selectedItem?.blockId === bl.id) selectedItem = null;
          renderAll();
        });

        blEl.addEventListener('dragstart', e => {
          selectedItem = null;
          const rect = blEl.getBoundingClientRect();
          const offsetMin = Math.round((e.clientY - rect.top) / SLOT_H_PX / SNAP_MIN) * SNAP_MIN;
          e.dataTransfer.setData('text/plain', JSON.stringify({type:'move', blockId:bl.id, offsetMin}));
          setTimeout(() => blEl.style.opacity = '0.3', 0);
        });
        blEl.addEventListener('dragend', () => blEl.style.opacity = '');
        slotDiv.appendChild(blEl);
      });
    }

    function buildAxis(sh, eh) {
      let h = '';
      for (let i = sh; i <= eh; i++) {
        const top = (i-sh)*60*SLOT_H_PX;
        h += `<div class="sch-axis-label" style="top:${top}px">${String(i).padStart(2,'0')}:00</div>`;
        if (i < eh) h += `<div class="sch-axis-half" style="top:${top+30*SLOT_H_PX}px"></div>`;
      }
      return h;
    }
    function buildGuides(totalMin) {
      let h = '';
      for (let m = 0; m < totalMin; m += 30) h += `<div class="sch-slot-guide" style="top:${m*SLOT_H_PX}px"></div>`;
      return h;
    }

    function snapToFreeSlot(rawMin, dur, dayIdx, roomIdx, skipId) {
      const base = Math.max(0, Math.round(rawMin / SNAP_MIN) * SNAP_MIN);
      const siblings = state.schedule.filter(b =>
        b.dayIdx === dayIdx && b.roomIdx === roomIdx && b.id !== skipId
      );

      for (const sib of siblings) {
        const sibEnd = sib.startMin + sib.durationMin;
        if (Math.abs(sibEnd - rawMin) <= SNAP_MIN * 1.5) {
          const clashWithOther = siblings.some(b =>
            b !== sib &&
            sibEnd < b.startMin + b.durationMin &&
            sibEnd + dur > b.startMin
          );
          if (!clashWithOther) return sibEnd;
        }
      }
      return base;
    }

    /* ── Auto-llenar Horario Aleatorio (para Testing) ── */
    function autoFillRandomSchedule() {
      state.schedule = [];
      selectedItem = null;
      const blocksToPlace = [];

      ordered.forEach(ev => {
        const rounds = state.rounds[ev.id] || [];
        rounds.forEach((rd, ri) => {
          if (ev.id === '333fm') {
            const n = FORMAT_ATTEMPTS_MAP[rd.format] || 3;
            for (let ai = 0; ai < n; ai++) {
              blocksToPlace.push({
                isCustom: false,
                eventId: '333fm',
                roundIdx: ri,
                attemptIdx: ai,
                dur: calcDur('333fm', ri),
                priority: ri * 10 + ai
              });
            }
          } else {
            blocksToPlace.push({
              isCustom: false,
              eventId: ev.id,
              roundIdx: ri,
              attemptIdx: null,
              dur: calcDur(ev.id, ri),
              priority: ri * 10
            });
          }
        });
      });

      if (sp.days.length > 0) {
        blocksToPlace.unshift({
          isCustom: true,
          customName: '📋 Registro y Acreditación',
          color: '#10b981',
          dur: 30,
          priority: -1,
        });
      }

      const grouped = {};
      blocksToPlace.forEach(b => {
        const p = b.priority;
        if (!grouped[p]) grouped[p] = [];
        grouped[p].push(b);
      });

      const finalQueue = [];
      Object.keys(grouped).sort((a,b) => +a - +b).forEach(p => {
        const arr = grouped[p];
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        finalQueue.push(...arr);
      });

      finalQueue.forEach(item => {
        let placed = false;
        const dur = item.dur;

        for (let dayIdx = 0; dayIdx < sp.days.length && !placed; dayIdx++) {
          const day = sp.days[dayIdx];
          const totalDayMin = (day.endHour - day.startHour) * 60;

          for (let roomIdx = 0; roomIdx < sp.rooms.length && !placed; roomIdx++) {
            const siblings = state.schedule.filter(b => b.dayIdx === dayIdx && b.roomIdx === roomIdx);
            siblings.sort((a,b) => a.startMin - b.startMin);

            let testStart = 0;
            if (siblings.length > 0) {
              const last = siblings[siblings.length - 1];
              testStart = Math.ceil((last.startMin + last.durationMin) / 5) * 5;
            }

            if (testStart + dur <= totalDayMin) {
              const clash = siblings.some(b => testStart < b.startMin + b.durationMin && testStart + dur > b.startMin);
              if (!clash) {
                state.schedule.push({
                  id: 'b' + Date.now() + Math.random().toString(36).slice(2, 5),
                  isCustom: item.isCustom || false,
                  customName: item.customName || null,
                  color: item.color || null,
                  eventId: item.eventId || null,
                  roundIdx: item.roundIdx !== undefined ? item.roundIdx : null,
                  attemptIdx: item.attemptIdx !== undefined ? item.attemptIdx : null,
                  roomIdx,
                  dayIdx,
                  startMin: testStart,
                  durationMin: dur
                });
                placed = true;
              }
            }
          }
        }

        if (!placed) {
          for (let dayIdx = 0; dayIdx < sp.days.length && !placed; dayIdx++) {
            const day = sp.days[dayIdx];
            const totalDayMin = (day.endHour - day.startHour) * 60;
            for (let roomIdx = 0; roomIdx < sp.rooms.length && !placed; roomIdx++) {
              for (let m = 0; m + dur <= totalDayMin; m += 15) {
                const clash = state.schedule.some(b =>
                  b.dayIdx === dayIdx && b.roomIdx === roomIdx &&
                  m < b.startMin + b.durationMin && m + dur > b.startMin
                );
                if (!clash) {
                  state.schedule.push({
                    id: 'b' + Date.now() + Math.random().toString(36).slice(2, 5),
                    isCustom: item.isCustom || false,
                    customName: item.customName || null,
                    color: item.color || null,
                    eventId: item.eventId || null,
                    roundIdx: item.roundIdx !== undefined ? item.roundIdx : null,
                    attemptIdx: item.attemptIdx !== undefined ? item.attemptIdx : null,
                    roomIdx,
                    dayIdx,
                    startMin: m,
                    durationMin: dur
                  });
                  placed = true;
                  break;
                }
              }
            }
          }
        }
      });

      sp.days.forEach((day, dayIdx) => {
        const lunchStart = Math.max(0, (13 - day.startHour) * 60);
        const lunchDur = 60;
        const clash = state.schedule.some(b => b.dayIdx === dayIdx && b.roomIdx === 0 && lunchStart < b.startMin + b.durationMin && lunchStart + lunchDur > b.startMin);
        if (!clash && lunchStart + lunchDur <= (day.endHour - day.startHour) * 60) {
          state.schedule.push({
            id: 'b' + Date.now() + Math.random().toString(36).slice(2, 5),
            isCustom: true,
            customName: '🍱 Almuerzo',
            color: '#f59e0b',
            roomIdx: 0,
            dayIdx,
            startMin: lunchStart,
            durationMin: lunchDur
          });
        }
      });

      renderAll();
    }

    function clearSchedule() {
      state.schedule = [];
      selectedItem = null;
      renderAll();
    }

    function renderAll() { renderTimesTable(); renderPalette(); renderTrash(); renderCalendar(); }

    // Tecla Escape para cancelar selección

    /* ── Tiempos promedio predeterminados ── */
    ordered.forEach(ev => {

        state.eventAvgSec[ev.id] = DEFAULT_EVENT_AVG_SEC[ev.id];

    /* ── Init ── */
    renderRooms();
    renderDays();
    renderAll();

    body.querySelector('#sch-btn-auto-fill')?.addEventListener('click', () => {
      autoFillRandomSchedule();
    });

    body.querySelector('#sch-btn-clear-all')?.addEventListener('click', () => {
      if (state.schedule.length > 0 && confirm('¿Deseas quitar todos los bloques del horario?')) {
        clearSchedule();
      }
    });

    body.querySelector('#to-back25').addEventListener('click', () => { step = 2; render(); });
    body.querySelector('#to-next25').addEventListener('click', () => { step = 2.7; render(); });
  }

        const reader = new FileReader();

  function renderStep28(body) {

    /* Inicializar con filas vacías si no hay nada */
    if (fi.income.length === 0)   fi.income   = [{ desc:'Inscripciones', qty:'', unit:'', total:'' }];

      { desc:'Porcentaje WCA + envío', qty:'', unit:'', total:'' },
      { desc:'Porcentaje delegatura',  qty:'', unit:'', total:'' },
      { desc:'',                       qty:'', unit:'', total:'' },
    ];

    function sumTotal(rows) {
      return rows.reduce((s, r) => {
        const v = parseFloat(String(r.total).replace(/[^0-9.]/g,''));
        return s + (isNaN(v) ? 0 : v);
      }, 0);
    }
    function fmtNum(n) {
      return n.toLocaleString('es-CO');
    }

    /* updateTotals: actualiza solo los badges y barra de balance,
       sin tocar el DOM de las filas — seguro de llamar en cada keystroke */
    function updateTotals() {
      const incTotal = sumTotal(fi.income);
      const expTotal = sumTotal(fi.expenses);
      const balance  = incTotal - expTotal;
      const bEl = body.querySelector('#fi-balance');
      if (bEl) { bEl.textContent = `Balance: $${fmtNum(balance)}`; bEl.style.color = balance >= 0 ? 'var(--acc2)' : 'var(--danger)'; }
      const iEl = body.querySelector('#fi-income-total');
      const eEl = body.querySelector('#fi-expense-total');
      if (iEl) iEl.textContent = '$' + fmtNum(incTotal);
      if (eEl) eEl.textContent = '$' + fmtNum(expTotal);
    }

    function rebuildTable() {
      /* Income table */
      const it = body.querySelector('#fi-income-body');
      if (it) {
        it.innerHTML = fi.income.map((r, i) => `
          <tr>
            <td><input class="fi-input" data-table="income" data-i="${i}" data-f="desc"  value="${r.desc}"  placeholder="Descripción"></td>
            <td><input class="fi-input fi-num" data-table="income" data-i="${i}" data-f="qty"   value="${r.qty}"   placeholder="—"></td>
            <td><input class="fi-input fi-num" data-table="income" data-i="${i}" data-f="unit"  value="${r.unit}"  placeholder="—"></td>
            <td><input class="fi-input fi-num" data-table="income" data-i="${i}" data-f="total" value="${r.total}" placeholder="0"></td>
            <td><button class="fi-del-btn" data-table="income" data-i="${i}">×</button></td>
          </tr>
        `).join('');
      }

      /* Expense table */
      const et = body.querySelector('#fi-expense-body');
      if (et) {
        et.innerHTML = fi.expenses.map((r, i) => `
          <tr>
            <td><input class="fi-input" data-table="expenses" data-i="${i}" data-f="desc"  value="${r.desc}"  placeholder="Gasto"></td>
            <td><input class="fi-input fi-num" data-table="expenses" data-i="${i}" data-f="qty"   value="${r.qty}"   placeholder="—"></td>
            <td><input class="fi-input fi-num" data-table="expenses" data-i="${i}" data-f="unit"  value="${r.unit}"  placeholder="—"></td>
            <td><input class="fi-input fi-num" data-table="expenses" data-i="${i}" data-f="total" value="${r.total}" placeholder="0"></td>
            <td><button class="fi-del-btn" data-table="expenses" data-i="${i}">×</button></td>
          </tr>
        `).join('');
      }

      /* Totals */
      const incTotal  = sumTotal(fi.income);
      const expTotal  = sumTotal(fi.expenses);
      const balance   = incTotal - expTotal;
      const balEl     = body.querySelector('#fi-balance');
      if (balEl) {
        balEl.textContent = `Balance: $${fmtNum(balance)}`;
        balEl.style.color = balance >= 0 ? 'var(--acc2)' : 'var(--danger)';
      }
      const itEl = body.querySelector('#fi-income-total');
      const etEl = body.querySelector('#fi-expense-total');
      if (itEl) itEl.textContent = '$' + fmtNum(incTotal);
      if (etEl) etEl.textContent = '$' + fmtNum(expTotal);

      /* ── Listeners: NUNCA reconstruye el DOM al escribir ──
         Solo actualiza el state y los badges de totales en el DOM existente.
         rebuildTable() solo se llama para añadir/eliminar filas. */
      body.querySelectorAll('.fi-input').forEach(inp => {
        inp.addEventListener('input', e => {
          const { table, i, f } = e.target.dataset;
          fi[table][+i][f] = e.target.value;

          /* Auto-calc total: si qty y unit son numéricos, actualizar
             directamente el input[data-f="total"] de esa misma fila,
             SIN reconstruir el DOM (conserva el foco) */
          if (f === 'qty' || f === 'unit') {
            const row = fi[table][+i];
            const q = parseFloat(String(row.qty).replace(/[^0-9.]/g,''));
            const u = parseFloat(String(row.unit).replace(/[^0-9.]/g,''));
            if (!isNaN(q) && !isNaN(u)) {
              const computed = String(Math.round(q * u));
              row.total = computed;
              /* Actualizar el input de total de la misma fila directamente */
              const totalInp = body.querySelector(
                `.fi-input[data-table="${table}"][data-i="${i}"][data-f="total"]`
              );
              if (totalInp) totalInp.value = computed;
            }
          }

          /* Actualizar badges y balance sin tocar el DOM de las filas */
          updateTotals();
        });
      });
      body.querySelectorAll('.fi-del-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const { table, i } = btn.dataset;
          fi[table].splice(+i, 1);
          rebuildTable();
        });
      });

    body.innerHTML = `

              placeholder="Ej: Patrocinio de GAN — $150.000" value="${fi.sponsorship}" maxlength="200">

        </div>
        <div style="overflow-x:auto;padding:0 18px 16px">
          <table class="fi-table">
            <thead><tr>
              <th>Descripción</th><th>Cantidad</th><th>Precio por unidad</th><th>Total</th><th></th>
            </tr></thead>
            <tbody id="fi-income-body"></tbody>
            <tfoot><tr>
              <td colspan="3" style="text-align:right;padding:10px 8px"><strong>Total ingresos</strong></td>
              <td class="fi-total-cell" id="fi-income-total-cell"></td><td></td>
            </tr></tfoot>
          </table>
          <button class="to-reg-tool" id="fi-add-income" style="margin-top:8px">+ Fila</button>
        </div>
      </div>

      <!-- Gastos -->
      <div class="to-ev-block" style="margin-bottom:16px">
        <div class="to-evb-header">
          <span class="to-evb-name">💸 Gastos</span>
          <span class="fi-total-badge fi-expense-badge" id="fi-expense-total">$0</span>
        </div>
        <div style="overflow-x:auto;padding:12px 18px 16px">
          <table class="fi-table">
            <thead><tr>
              <th>Gasto</th><th>Cantidad</th><th>Precio por unidad</th><th>Total</th><th></th>
            </tr></thead>
            <tbody id="fi-expense-body"></tbody>
            <tfoot><tr>
              <td colspan="3" style="text-align:right;padding:10px 8px"><strong>Total gastos</strong></td>
              <td class="fi-total-cell" id="fi-expense-total-cell"></td><td></td>
            </tr></tfoot>
          </table>
          <button class="to-reg-tool" id="fi-add-expense" style="margin-top:8px">+ Fila</button>
        </div>
      </div>

      <!-- Balance -->
      <div class="fi-balance-bar">
        <span class="fi-balance-label" id="fi-balance">Balance: $0</span>
      </div>

      <div class="to-actions">
        <button class="to-btn-secondary" id="to-back28">← Volver</button>
        <button class="to-btn-primary"   id="to-next28">Ver resumen →</button>
      </div>
    `;

    /* Sponsorship live save */
    body.querySelector('#fi-sponsorship').addEventListener('input', e => { fi.sponsorship = e.target.value; });

    /* Fix tfoot cells to use same id as header badges */
    body.querySelector('#fi-income-total-cell').id  = '';
    body.querySelector('#fi-expense-total-cell').id = '';

    /* Add row buttons */
    body.querySelector('#fi-add-income').addEventListener('click', () => {
      fi.income.push({ desc:'', qty:'', unit:'', total:'' }); rebuildTable();
    });
    body.querySelector('#fi-add-expense').addEventListener('click', () => {
      fi.expenses.push({ desc:'', qty:'', unit:'', total:'' }); rebuildTable();
    });

    rebuildTable();

    body.querySelector('#to-back28').addEventListener('click', () => { step = 2.7; render(); });
    body.querySelector('#to-next28').addEventListener('click', () => { step = 3;   render(); });
  }

        return text.split('\n').map(l=>l.trim()).filter(l=>l).map(l=>{
          const m=l.match(/^(\d+)\.\s*(.*)/);
          return m?{numbered:true,n:m[1],text:m[2]}:{numbered:false,text:l};
        });
      }
      function buildSumBlock(lang, title, text) {
        if (!text) return '';
        const items = parseItemsSum(text);
        const html = items.map(it=>
          it.numbered
            ?`<div class="to-prv-item"><span class="to-prv-n">${it.n}.</span><span class="to-prv-text">${it.text}</span></div>`
            :`<p class="to-prv-p">${it.text}</p>`
        ).join('');
        return `<div class="to-prv-block"><div class="to-prv-header"><span class="to-reg-lang-badge ${lang}">${lang.toUpperCase()}</span><span class="to-prv-title">${title}</span></div><div class="to-prv-body">${html}</div></div>`;
      }
      sumReg.innerHTML = buildSumBlock('es','REGISTRO',state.regEs) + buildSumBlock('en','REGISTRATION',state.regEn);
    }

    const summary = body.querySelector('#to-summary');
    ordered.forEach(ev => {
      const rounds = state.rounds[ev.id];
      const card = document.createElement('div');
      card.className = 'to-summary-card';

      const rowsHtml = rounds.map((rd, idx) => {
        const isFinal = idx === rounds.length - 1;
        const fmtLabel = FORMATS.find(f=>f.id===rd.format)?.label || rd.format;

        return `

            <span class="to-sum-rnd">Ronda ${idx+1}${isFinal?' · Final':''}</span>

            ${rd.timeLimit?`<span class="to-sum-chip">⏱ ${rd.timeLimit}</span>`:''}
            ${evDef.hasCutoff&&rd.cutoff?`<span class="to-sum-chip to-sum-cut">✂ ${rd.cutoff}</span>`:''}
            ${!isFinal&&rd.advance?`<span class="to-sum-chip to-sum-adv">↑ ${rd.advance}${rd.advanceType==='p'?'%':''} avanzan</span>`:''}
          </div>
        `;
      }).join('');

      card.innerHTML = `
        <div class="to-sum-header">
          <span class="ec-ico loading" id="to-sum-ico-${ev.id}"></span>
          <span class="to-sum-name">${ev.name}</span>
          <span class="to-evb-id">${ev.id}</span>
          <span class="to-sum-rounds-badge">${rounds.length} ronda${rounds.length>1?'s':''}</span>

      summary.appendChild(card);
      loadEventIcon(ev.id, card.querySelector(`#to-sum-ico-${ev.id}`));

    /* Render horario en el resumen */
    const sumSch = body.querySelector('#to-sum-schedule');
    if (sumSch && state.schedule.length > 0) {
      const sp = state.scheduleParams;
      let html = '';
      sp.days.forEach((day, di) => {
        const dayBlocks = state.schedule.filter(b => b.dayIdx === di);
        if (dayBlocks.length === 0) return;
        html += `<div class="to-summary-card" style="margin-bottom:12px">
          <div class="to-sum-header">
            <span style="font-size:14px;font-weight:500;color:var(--txt)">${day.label}</span>
            <span class="to-evb-id">${day.date}</span>
          </div>
          <div class="to-sum-rows" style="gap:6px">`;
        const sorted = [...dayBlocks].sort((a,b) => a.roomIdx - b.roomIdx || a.startMin - b.startMin);
        sorted.forEach(bl => {
          const isCust = bl.isCustom || !bl.eventId;
          const ev = !isCust ? ALL_EVENTS.find(e => e.id === bl.eventId) : null;
          const isAttempt = !isCust && bl.eventId === '333fm' && bl.attemptIdx != null;
          const title = isCust ? bl.customName : (isAttempt ? `${ev ? ev.name : bl.eventId} · R${bl.roundIdx+1} (Intento ${bl.attemptIdx+1})` : `${ev ? ev.name : bl.eventId} · R${bl.roundIdx+1}`);
          const room = sp.rooms[bl.roomIdx] || 'Sala';
          const sh = day.startHour + Math.floor(bl.startMin/60);
          const sm = bl.startMin % 60;
          const em = bl.startMin + bl.durationMin;
          const eh = day.startHour + Math.floor(em/60);
          const emm = em % 60;
          const ts = `${String(sh).padStart(2,'0')}:${String(sm).padStart(2,'0')} – ${String(eh).padStart(2,'0')}:${String(emm).padStart(2,'0')}`;
          const dur = bl.durationMin >= 60 ? Math.floor(bl.durationMin/60)+'h'+(bl.durationMin%60?String(bl.durationMin%60).padStart(2,'0')+'m':'') : bl.durationMin+'min';
          html += `<div class="to-sum-row">
            <span class="to-sum-rnd">${ts}</span>
            <span class="to-sum-chip" style="${isCust ? 'border-color:rgba(255,184,77,.35);color:#ffd080;background:rgba(255,184,77,.08)' : ''}">${title}</span>
            <span class="to-sum-chip" style="color:var(--txt3)">${room}</span>
            <span class="to-sum-chip to-sum-adv">${dur}</span>

      sumSch.innerHTML = html || '<p style="font-size:13px;color:var(--txt3)">Sin bloques programados.</p>';
    } else if (sumSch) {
      sumSch.innerHTML = '<p style="font-size:13px;color:var(--txt3)">Sin bloques programados aún.</p>';
    }

    /* Render fotos en resumen */
    const sumPhotos = body.querySelector('#to-sum-photos');
    if (sumPhotos) {
      if (state.photos.length === 0) {
        sumPhotos.innerHTML = '<p style="font-size:13px;color:var(--txt3);margin-bottom:16px">Sin fotos añadidas.</p>';
      } else {

        grid.className = 'ph-sum-grid';
        state.photos.forEach(ph => {
          const card = document.createElement('div');
          card.className = 'ph-sum-card';
          card.innerHTML = `

          grid.appendChild(card);

    /* Render ingresos y gastos en resumen */

    if (sumFi) {
      const fi = state.finances;
      function fmtN(n) { return n.toLocaleString('es-CO'); }
      function sumT(rows) { return rows.reduce((s,r) => { const v=parseFloat(String(r.total).replace(/[^0-9.]/g,'')); return s+(isNaN(v)?0:v); },0); }
      const incTotal = sumT(fi.income);
      const expTotal = sumT(fi.expenses);
      const balance  = incTotal - expTotal;
      const balColor = balance >= 0 ? 'var(--acc2)' : 'var(--danger)';

      function buildFiTable(rows, label) {
        if (!rows.length) return '';

              <tbody>${rowsHtml}</tbody>
              <tfoot><tr><td colspan="3"><strong>Total</strong></td><td class="fi-td-num"><strong>$${fmtN(total)}</strong></td></tr></tfoot>

      sumFi.innerHTML = `
        ${fi.sponsorship ? `<p style="font-size:13px;color:var(--txt2);margin-bottom:12px">Patrocinio: ${fi.sponsorship}</p>` : ''}

          ${buildFiTable(fi.income, '💰 Ingresos')}

    body.querySelector('#to-reset').addEventListener('click', () => {
      if (!confirm('¿Crear un nuevo torneo? Se perderán todos los datos actuales.')) return;
      Object.assign(state, {
        name:'', nameReason:'', country:'', city:'', venue:'',
        venueDetails:'', venueAddress:'', eventDate:'', eventDates:[], organizers:'',
        sponsors:'', competitorLimit:'', competitorLimitReason:'', registrationFee:'',
        regEs:'', regEn:'', selectedEvents:[], rounds:{},
        scheduleParams:{ stations:8, overFactor:1.2, rooms:['Salon principal'], days:[] },
        eventAvgSec:{}, schedule:[],
      });
      step = 1; render();
